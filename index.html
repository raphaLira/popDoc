  /* ============================================================
     RENDER + EVENTOS
  ============================================================ */
  const root = document.getElementById("root");

  function render(){
    // Visão do colaborador é tela cheia, fora do app shell (com ou sem login).
    if (App.tela === "colaborador"){
      root.innerHTML = viewColaborador();
      ligarColaborador();
      return;
    }
    if (!Auth.perfil){
      root.innerHTML = viewLogin();
      ligarLogin();
      return;
    }
    // App logado: escolhe a tela interna
    let inner;
    if (App.tela === "pop") inner = viewPop();
    else if (App.tela === "novopop") inner = viewNovoPop();
    else if (App.tela === "distribuir") inner = viewDistribuir();
    else if (App.tela === "alertas") inner = viewAlertas();
    else if (App.tela === "planos") inner = viewPlanos();
    else if (App.tela === "equipe") inner = viewEquipe();
    else inner = viewBiblioteca();

    root.innerHTML = viewApp(inner);
    ligarApp();
    // renderiza o QR depois que o DOM existe
    if (App.tela === "distribuir") desenharQR();
  }

  // Gera o QR Code na caixa (usa a lib qrcodejs via CDN).
  function desenharQR(){
    const box = document.getElementById("qr-box");
    if (!box) return;
    const p = DB.getPop(App.distribuirPop);
    if (!p) return;
    box.innerHTML = "";
    try {
      if (window.QRCode){
        new window.QRCode(box, { text: linkLeitura(p), width: 160, height: 160,
          colorDark: "#160A33", colorLight: "#ffffff" });
      } else {
        box.innerHTML = '<span style="font-family:var(--mono);font-size:11px;color:var(--ink-soft)">QR indisponível offline</span>';
      }
    } catch(e){
      box.innerHTML = '<span style="font-family:var(--mono);font-size:11px;color:var(--ink-soft)">QR indisponível</span>';
    }
  }

  function ligarApp(){
    // Menu da conta (abre pelo avatar do topo ou pelo chip da sidebar)
    const abrirConta = () => { App.contaAberta = true; render(); };
    const btnConta = document.getElementById("btn-conta");
    if (btnConta) btnConta.onclick = abrirConta;
    const btnContaSide = document.getElementById("btn-conta-side");
    if (btnContaSide) btnContaSide.onclick = abrirConta;
    const contaBg = document.getElementById("conta-bg");
    if (contaBg) contaBg.onclick = (ev) => { if (ev.target === contaBg){ App.contaAberta = false; render(); } };
    const menuSair = document.getElementById("menu-sair");
    if (menuSair) menuSair.onclick = () => { App.tela="biblioteca"; App.popId=null; App._leu=false; App.configAberta=false; App.contaAberta=false; Auth.sair(); };
    const menuConfig = document.getElementById("menu-config");
    if (menuConfig) menuConfig.onclick = () => { App.contaAberta = false; App.configAberta = true; render(); };

    // Configurações do estabelecimento
    const cfgFechar = () => { App.configAberta = false; render(); };
    const cfgBg = document.getElementById("cfg-bg");
    if (cfgBg) cfgBg.onclick = (ev) => { if (ev.target === cfgBg) cfgFechar(); };
    const cfgX = document.getElementById("cfg-fechar");
    if (cfgX) cfgX.onclick = cfgFechar;
    const cfgCancelar = document.getElementById("cfg-cancelar");
    if (cfgCancelar) cfgCancelar.onclick = cfgFechar;
    // atualiza o banner ao trocar o estado no seletor
    const cfgUf = document.getElementById("cfg-uf");
    if (cfgUf) cfgUf.onchange = () => {
      if (Auth.estabelecimento) Auth.estabelecimento.uf = cfgUf.value;
      render();
    };
    const cfgSalvar = document.getElementById("cfg-salvar");
    if (cfgSalvar) cfgSalvar.onclick = async () => {
      const e = Auth.estabelecimento;
      if (e){
        await Auth.salvarEstabelecimento({
          nome: (document.getElementById("cfg-nome").value||"").trim() || e.nome,
          cidade: (document.getElementById("cfg-cidade").value||"").trim(),
          uf: document.getElementById("cfg-uf").value,
        });
      }
      App.configAberta = false;
      render();
    };

    // Navegação (sidebar, tabbar, back-links, botões data-nav)
    document.querySelectorAll("[data-nav]").forEach(el => {
      el.onclick = () => { App._leu=false; irPara(el.getAttribute("data-nav")); };
    });

    // Abrir POP (cards e botões "revisar" com data-pop)
    document.querySelectorAll("[data-pop]").forEach(el => {
      el.onclick = (ev) => { ev.stopPropagation(); App._leu=false; irPara("pop", el.getAttribute("data-pop")); };
    });

    // Busca na biblioteca
    const busca = document.getElementById("in-busca");
    if (busca){
      busca.oninput = () => { App.busca = busca.value; };
      busca.onkeyup = (e) => {
        // re-render preservando foco/cursor
        const pos = busca.selectionStart;
        render();
        const nb = document.getElementById("in-busca");
        if (nb){ nb.focus(); nb.setSelectionRange(pos,pos); }
      };
    }

    // Novo POP → tela de criação
    const btnNovo = document.getElementById("btn-novo");
    if (btnNovo) btnNovo.onclick = () => { App.novoPop = {}; App.novoErro = null; irPara("novopop"); };

    // ---- Novo POP: escolha de caminho ----
    document.querySelectorAll("[data-modo]").forEach(el => {
      el.onclick = () => { App.novoPop = { modo: el.getAttribute("data-modo") }; App.novoErro = null; render(); };
    });
    const novoVoltar = document.getElementById("novo-voltar");
    if (novoVoltar) novoVoltar.onclick = () => { App.novoPop = {}; App.novoErro = null; render(); };

    // usar modelo → cria POP e abre editor
    document.querySelectorAll("[data-modelo]").forEach(el => {
      el.onclick = async () => {
        const e = Auth.estabelecimento || {};
        const m = DB.listarModelos(e.uf).find(x => x.id === el.getAttribute("data-modelo"));
        if (!m) return;
        const pop = await DB.criarPop({ nome:m.nome, categoria:m.categoria, origem:"modelo", conteudo:m.conteudo });
        App.novoPop = null;
        App.popId = pop.id; App.tela = "pop"; App.abaPop = "documento";
        App.editando = true; App.rascunhoConteudo = pop.conteudo;
        render();
      };
    });

    // criar do zero
    const npCriar = document.getElementById("np-criar");
    if (npCriar) npCriar.onclick = async () => {
      const nome = (document.getElementById("np-nome").value||"").trim();
      const cat = (document.getElementById("np-cat").value||"").trim() || "Geral";
      if (!nome){ App.novoErro = "Informe o nome do procedimento."; render(); return; }
      const pop = await DB.criarPop({ nome, categoria:cat, origem:"ia" });
      App.novoPop = null;
      App.popId = pop.id; App.tela = "pop"; App.abaPop = "documento";
      App.editando = true; App.rascunhoConteudo = pop.conteudo;
      render();
    };

    // ---- Editor de POP ----
    const btnEditar = document.getElementById("btn-editar");
    if (btnEditar) btnEditar.onclick = () => {
      const p = DB.getPop(App.popId);
      App.editando = true; App.rascunhoConteudo = p ? p.conteudo : ""; render();
      const ta = document.getElementById("pop-editor"); if (ta) ta.focus();
    };
    // manter o buffer sincronizado ao digitar
    const editor = document.getElementById("pop-editor");
    if (editor) editor.oninput = () => { App.rascunhoConteudo = editor.value; };

    const btnSalvarV = document.getElementById("btn-salvar-versao");
    if (btnSalvarV) btnSalvarV.onclick = async () => {
      const nota = (document.getElementById("pop-nota").value||"").trim();
      btnSalvarV.disabled = true;
      await DB.salvarNovaVersao(App.popId, App.rascunhoConteudo, nota);
      App.editando = false; App._leu = false;
      render();
    };
    const btnCancelarEd = document.getElementById("btn-cancelar-edicao");
    if (btnCancelarEd) btnCancelarEd.onclick = () => { App.editando = false; render(); };

    // ---- Aprovação / status ----
    const btnEnviarAp = document.getElementById("btn-enviar-aprovacao");
    if (btnEnviarAp) btnEnviarAp.onclick = async () => { await DB.definirStatus(App.popId, "aprovacao"); render(); };
    const btnAprovar = document.getElementById("btn-aprovar");
    if (btnAprovar) btnAprovar.onclick = async () => { await DB.definirStatus(App.popId, "vigente"); render(); };

    // Distribuir → tela de distribuição
    const btnDist = document.getElementById("btn-distribuir");
    if (btnDist) btnDist.onclick = () => { App.distribuirPop = App.popId; irPara("distribuir"); };
    const btnFaixaDist = document.getElementById("btn-faixa-distribuir");
    if (btnFaixaDist) btnFaixaDist.onclick = () => { App.distribuirPop = App.popId; irPara("distribuir"); };
    const btnLeituraDist = document.getElementById("leitura-distribuir");
    if (btnLeituraDist) btnLeituraDist.onclick = () => { App.distribuirPop = App.popId; irPara("distribuir"); };
    // Exportar PDF (via janela de impressão do navegador)
    const btnPdf = document.getElementById("btn-pdf");
    if (btnPdf) btnPdf.onclick = () => exportarPopPDF(App.popId);

    // Abas do POP
    document.querySelectorAll("[data-aba]").forEach(el => {
      el.onclick = () => { App.abaPop = el.getAttribute("data-aba"); render(); };
    });

    // Confirmar leitura
    const btnConf = document.getElementById("btn-confirmar");
    if (btnConf) btnConf.onclick = () => { App._leu = true; render(); };

    // ---- Distribuir ----
    const distVoltar = document.getElementById("dist-voltar");
    if (distVoltar) distVoltar.onclick = () => { App.popId = App.distribuirPop; irPara("pop"); };
    const distCopiar = document.getElementById("dist-copiar");
    if (distCopiar) distCopiar.onclick = () => {
      const p = DB.getPop(App.distribuirPop);
      const url = linkLeitura(p);
      copiarTexto(url);
      distCopiar.innerHTML = `${ic.check} Copiado`;
      setTimeout(() => { distCopiar.innerHTML = `${ic.copy} Copiar`; }, 1600);
    };
    const distWpp = document.getElementById("dist-wpp");
    if (distWpp) distWpp.onclick = () => {
      const p = DB.getPop(App.distribuirPop);
      const msg = `Leitura obrigatória do POP "${p.nome}": ${linkLeitura(p)}`;
      window.open("https://wa.me/?text=" + encodeURIComponent(msg), "_blank");
    };
    const distTestar = document.getElementById("dist-testar");
    if (distTestar) distTestar.onclick = () => {
      App.colabPop = DB.getPop(App.distribuirPop);
      App.colabEtapa = "ler"; App.colabCpf = ""; App.colabErro = null; App.colabRegistro = null;
      irPara("colaborador");
    };
    const distImprimir = document.getElementById("dist-imprimir");
    if (distImprimir) distImprimir.onclick = () => window.print();

    // ---- Equipe ----
    const chkInativos = document.getElementById("chk-inativos");
    if (chkInativos) chkInativos.onchange = () => { App.mostrarInativos = chkInativos.checked; render(); };

    const btnNovoFunc = document.getElementById("btn-novo-func");
    if (btnNovoFunc) btnNovoFunc.onclick = () => { App.funcEdit = {}; App.funcErro = null; render(); };

    document.querySelectorAll("[data-editfunc]").forEach(el => {
      el.onclick = () => { App.funcEdit = Object.assign({}, DB.getFuncionario(el.getAttribute("data-editfunc"))); App.funcErro = null; render(); };
    });
    document.querySelectorAll("[data-inativar]").forEach(el => {
      el.onclick = async () => { if (confirm("Inativar este funcionário? O histórico de leitura é preservado.")){ await DB.inativarFuncionario(el.getAttribute("data-inativar")); render(); } };
    });
    document.querySelectorAll("[data-reativar]").forEach(el => {
      el.onclick = async () => { await DB.reativarFuncionario(el.getAttribute("data-reativar")); render(); };
    });

    // Formulário de funcionário
    const fecharForm = () => { App.funcEdit = null; App.funcErro = null; render(); };
    const bg = document.getElementById("modal-bg");
    if (bg) bg.onclick = (ev) => { if (ev.target === bg) fecharForm(); };
    const btnFechar = document.getElementById("func-fechar");
    if (btnFechar) btnFechar.onclick = fecharForm;
    const btnCancelar = document.getElementById("func-cancelar");
    if (btnCancelar) btnCancelar.onclick = fecharForm;

    // máscara de CPF ao digitar
    const inCpf = document.getElementById("f-cpf");
    if (inCpf) inCpf.oninput = () => { const pos = inCpf.selectionStart; inCpf.value = mascaraCpf(inCpf.value); };

    const btnSalvar = document.getElementById("func-salvar");
    if (btnSalvar) btnSalvar.onclick = async () => {
      const getEl = (id) => document.getElementById(id);
      const get = (id) => { const el = getEl(id); return el ? (el.value || "").trim() : ""; };
      const dados = {
        nome: get("f-nome"), cpf: get("f-cpf"), cargo: get("f-cargo"),
        papel: get("f-papel") || "leitor", crf: get("f-crf"), email: get("f-email"),
        telefone: get("f-tel"), admissao: get("f-adm"),
      };
      // VALIDAÇÃO PROVISÓRIA AFROUXADA — só nome e CPF (âncora do registro de leitura).
      // Cargo, e-mail, telefone e admissão estão opcionais por ora.
      if (!dados.nome){ App.funcErro = "Informe ao menos o nome."; render(); return; }
      // Na EDIÇÃO, não revalida o CPF já salvo (ele já foi aceito no cadastro).
      // Só valida se for cadastro novo, ou se o CPF foi alterado.
      const editando = App.funcEdit && App.funcEdit.id;
      const cpfMudou = !editando || (App.funcEdit && App.funcEdit.cpf !== dados.cpf);
      if (!dados.cpf){ App.funcErro = "Informe o CPF — ele identifica quem leu cada POP."; render(); return; }
      if (cpfMudou && !cpfValido(dados.cpf)){ App.funcErro = "CPF inválido. Verifique os números."; render(); return; }
      // CPF duplicado (mantido: evita registro ambíguo)
      const e = Auth.estabelecimento || {};
      const dup = DB.listarFuncionarios(e.id, true).find(c => c.cpf === dados.cpf && c.id !== (App.funcEdit && App.funcEdit.id));
      if (dup){ App.funcErro = "Já existe um funcionário com este CPF."; render(); return; }

      if (App.funcEdit && App.funcEdit.id) dados.id = App.funcEdit.id;
      try {
        await DB.salvarFuncionario(dados);
        App.funcEdit = null; App.funcErro = null;
        render();
      } catch(err){
        App.funcErro = "Não foi possível salvar: " + (err && err.message ? err.message : "erro desconhecido");
        render();
      }
    };
  }

  function ligarLogin(){
    const form = document.getElementById("form-login");
    const btnEntrar = document.getElementById("btn-entrar");
    const btnGoogle = document.getElementById("btn-google");
    const errBox = document.getElementById("login-err");

    form.onsubmit = async (ev) => {
      ev.preventDefault();
      errBox.innerHTML = "";
      btnEntrar.disabled = true;
      btnEntrar.innerHTML = ic.loader;
      const email = document.getElementById("in-email").value;
      const senha = document.getElementById("in-senha").value;
      const { erro } = await Auth.entrarComEmail(email, senha);
      if (erro){
        errBox.innerHTML = `<div class="err">${erro}</div>`;
        btnEntrar.disabled = false;
        btnEntrar.innerHTML = `Entrar ${ic.arrow}`;
      } else {
        render();

    btnGoogle.onclick = async () => {
      btnGoogle.disabled = true;
      btnGoogle.innerHTML = ic.loader + " Conectando…";
      const { erro } = await Auth.entrarComGoogle();
      if (erro){
        errBox.innerHTML = `<div class="err">${erro}</div>`;
        btnGoogle.disabled = false;
        btnGoogle.innerHTML = `${ic.google} Continuar com Google`;
      } else if (MODO_MOCK){
        render();
      }
    };
  }

      App.colabPop = null; App.colabEtapa = "ler";

    if (btnConfirmar) btnConfirmar.onclick = async () => {
      const cpf = App.colabCpf;
      const e = Auth.estabelecimento || {};
      if (!cpfValido(cpf)){ App.colabErro = "CPF inválido. Verifique os números."; render(); return; }
      const colab = DB.buscarColaboradorPorCpf(e.id, cpf);
      if (!colab){ App.colabErro = "CPF não encontrado. Confirme com o responsável técnico se você está cadastrado."; render(); return; }
      const p = App.colabPop;
      btnConfirmar.disabled = true;

      App.colabRegistro = reg || { leitor_nome: colab.nome, confirmado_em: new Date().toISOString() };
      App.colabEtapa = "feito";
      render();
    };
  }

  // Copia texto para a área de transferência (com fallback).
  function copiarTexto(txt){
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(txt); return; }
    } catch(e){}
    const ta = document.createElement("textarea");
    ta.value = txt; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch(e){}
    document.body.removeChild(ta);
  }

  // Detecta se a URL é um link de leitura: #/ler/{estabId}/{popId}
  function rotaLeitura(){
    const h = (window.location.hash || "");
    const m = h.match(/#\/ler\/([^/]+)\/([^/]+)/);
    return m ? { estabId: m[1], popId: m[2] } : null;
  }

  // Inicialização.
  (async function init(){
    try {
      if (!MODO_MOCK && sb){
        const { data } = await sb.auth.getSession();
        if (data && data.session){ await Auth._hidratarReal(); await carregarDados(); }
      }

      // Link de leitura do colaborador (abre direto na visão pública).
      const rota = rotaLeitura();
      if (rota){
        if (MODO_MOCK){
          carregarDoMock();
          Auth.estabelecimento = MOCK.estabelecimentos.find(e => e.id === rota.estabId) || MOCK.estabelecimentos[0];
        } else {
          // carrega o estabelecimento e o POP público (leitura liberada por RLS).
          const { data:e } = await sb.from("estabelecimentos").select("*").eq("id", rota.estabId).maybeSingle();
          if (e){
            Auth.estabelecimento = e;
            const { data:pops } = await sb.from("pops").select("*").eq("estabelecimento_id", rota.estabId);
            const { data:colabs } = await sb.from("colaboradores").select("*").eq("estabelecimento_id", rota.estabId);
            Store.pops = (pops||[]).map(mapPop);
            Store.colaboradores = (colabs||[]).map(mapColab);
          }
        }
        const pop = DB.getPop(rota.popId);
        if (pop){
          App.colabPop = pop; App.colabEtapa = "ler"; App.tela = "colaborador";
        }
      }
    } catch (e) {
      console.log("[DocFlow] erro ao inicializar:", e && e.message);
    }
    render();
  })();
  </script>
</body>
</html>
