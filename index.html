<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#160A33" />
  <title>DocFlow AI — Gestão de POPs</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* ============================================================
       DocFlow AI — estilos
       Identidade clínica: verde de saúde pública, tipografia técnica.
    ============================================================ */
    :root{
      --bg:#F4F2FB; --panel:#FFFFFF; --ink:#1B1430; --ink-soft:#6E6584;
      --line:#E6E0F4; --brand:#6C3BF5; --brand-deep:#241052; --brand-noite:#160A33;
      --brand-soft:#EFEAFD; --amber:#F5A623; --amber-soft:#FDF0D8; --amber-deep:#E8870A;
      --green:#00A878; --green-soft:#E0F5EE;
      --red:#E5484D; --red-soft:#FCE9EA;
      --sans:'Plus Jakarta Sans',system-ui,sans-serif;
      --display:'Unbounded','Plus Jakarta Sans',sans-serif;
      --mono:'DM Mono',ui-monospace,monospace;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}
    .content, .pop-card, .team-card{min-width:0}
    .pop-card .nome, .team-card .nome, .pop-card .sub, .team-card .sub{overflow-wrap:anywhere}
    button{font-family:inherit;cursor:pointer}
    input{font-family:inherit}
    a{color:var(--brand);text-decoration:none}
    .hidden{display:none !important}
    @keyframes spin{to{transform:rotate(360deg)}}
    .spin{animation:spin 1s linear infinite}

    /* ---- Login ---- */
    .login-wrap{min-height:100vh;display:flex}
    .login-brand{flex:1;background:linear-gradient(170deg,var(--brand-noite) 0%,var(--brand-deep) 60%,#3A1A85 100%);padding:48px 44px;display:flex;
      flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
    .login-brand h1{color:#fff;font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:-.01em;line-height:1.2;margin-bottom:16px;max-width:420px}
    .login-brand p{color:#CBBEF0;font-size:15px;line-height:1.6;max-width:420px}
    .brand-logo{display:flex;align-items:center;gap:12px}
    .brand-logo .mark{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#8B5CFF,#6C3BF5);display:grid;place-items:center}
    .brand-logo .name{color:#fff;font-family:var(--display);font-size:18px;font-weight:700;line-height:1}
    .brand-logo .name span{color:#C9B6FF}
    .brand-logo .sub{font-family:var(--mono);font-size:9px;color:#9B8FC7;letter-spacing:.12em;margin-top:4px}
    .brand-foot{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:#9B8FC7}
    .circle{position:absolute;border-radius:999px;border:1px solid rgba(255,255,255,.05)}

    .login-form-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 24px}
    .login-card{width:100%;max-width:380px}
    .logo-mobile{display:none;align-items:center;gap:10px;margin-bottom:28px}
    .logo-mobile .mark{width:32px;height:32px;border-radius:8px;background:var(--brand);display:grid;place-items:center}
    .logo-mobile .name{font-size:17px;font-weight:700}
    .logo-mobile .name span{color:var(--brand)}
    .login-card h2{font-family:var(--display);font-size:23px;font-weight:700;margin-bottom:6px}
    .login-card .lead{font-size:14px;color:var(--ink-soft);margin-bottom:28px}

    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;
      font-size:14px;font-weight:600;padding:12px 16px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
    .btn-primary{background:linear-gradient(135deg,#7C4DFF,#6C3BF5);color:#fff;border:none;font-size:15px;
      padding:13px 16px;box-shadow:0 4px 14px rgba(108,59,245,.32)}
    .btn-primary:hover{background:linear-gradient(135deg,#6C3BF5,#5730C9)}
    .btn-block{width:100%}
    .btn:disabled{opacity:.65;cursor:default}

    .divider{display:flex;align-items:center;gap:12px;margin:20px 0}
    .divider .ln{flex:1;height:1px;background:var(--line)}
    .divider span{font-family:var(--mono);font-size:11px;color:var(--ink-soft)}

    label.field{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
    .input-wrap{position:relative;margin-bottom:14px}
    .input-wrap svg{position:absolute;left:12px;top:12px;color:var(--ink-soft);pointer-events:none}
    .input-wrap input{width:100%;padding:11px 12px 11px 38px;border-radius:10px;border:1px solid var(--line);
      font-size:14px;color:var(--ink);background:var(--panel);transition:border-color .15s,box-shadow .15s}
    .input-wrap input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}

    .err{background:var(--red-soft);color:var(--red);font-size:13px;padding:10px 12px;border-radius:8px;margin-bottom:16px}
    .demo-box{margin-top:24px;padding:12px 14px;border-radius:8px;background:var(--brand-soft);
      font-family:var(--mono);font-size:11px;color:var(--brand-deep);line-height:1.6}

    /* ---- App shell ---- */
    .app{min-height:100vh;display:flex;flex-direction:column}
    .topbar{display:flex;align-items:center;gap:12px;padding:14px 24px;background:linear-gradient(120deg,var(--brand-noite),var(--brand-deep))}
    .topbar .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#8B5CFF,#6C3BF5);display:grid;place-items:center}
    .topbar .name{color:#fff;font-family:var(--display);font-size:15px;font-weight:700}
    .topbar .name span{color:#C9B6FF}
    .topbar .estab{margin-left:auto;font-family:var(--mono);font-size:11px;color:#C9B6FF;text-align:right}
    .btn-logout{background:transparent;border:1px solid rgba(255,255,255,.2);color:#E8E0FA;border-radius:8px;
      padding:7px 12px;font-size:13px;display:flex;align-items:center;gap:6px;margin-left:16px}

    .body{flex:1;display:flex}

    /* sidebar (desktop) */
    .sidebar{width:230px;background:linear-gradient(180deg,var(--brand-deep),var(--brand-noite));padding:18px 14px;display:flex;flex-direction:column;gap:4px}
    .nav-item{display:flex;align-items:center;gap:11px;width:100%;padding:10px 13px;border-radius:8px;border:none;
      background:transparent;color:#C9BEE8;font-size:14px;font-weight:500;text-align:left}
    .nav-item.active{background:var(--brand-soft);color:var(--brand-deep);font-weight:600}
    .nav-item .badge{margin-left:auto;background:var(--amber);color:#fff;font-family:var(--mono);font-size:10px;
      font-weight:700;padding:1px 6px;border-radius:99px}
    .sidebar-foot{margin-top:auto;border-top:1px solid rgba(255,255,255,.08);padding-top:10px}
    .user-chip{display:flex;align-items:center;gap:10px;padding:10px 13px}
    .user-chip .av{width:30px;height:30px;border-radius:99px;background:linear-gradient(135deg,#8B5CFF,#6C3BF5);display:grid;place-items:center;
      color:#fff;font-family:var(--mono);font-size:12px;font-weight:700}
    .user-chip .nm{font-size:12px;font-weight:600;color:#fff}
    .user-chip .rl{font-family:var(--mono);font-size:10px;color:#9B8FC7}

    .content{flex:1;max-width:960px;margin:0 auto;width:100%;padding:28px 32px}

    /* bottom tab bar (mobile) */
    .tabbar{display:none;border-top:1px solid var(--line);background:var(--panel)}
    .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 6px;border:none;
      background:none;color:var(--ink-soft);position:relative}
    .tab.active{color:var(--brand)}
    .tab .lbl{font-size:10px;font-weight:600}
    .tab .dot{position:absolute;top:6px;right:calc(50% - 14px);width:7px;height:7px;border-radius:99px;
      background:var(--amber);border:1.5px solid var(--panel)}

    /* ---- Biblioteca ---- */
    .page-head{margin-bottom:22px}
    .page-head-row{display:flex;align-items:center;gap:13px}
    .page-icon{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,#7C4DFF,#6C3BF5);
      display:grid;place-items:center;color:#fff;flex-shrink:0;box-shadow:0 6px 16px rgba(108,59,245,.3)}
    .page-icon.amber{background:linear-gradient(135deg,#F7B733,#F5A623);box-shadow:0 6px 16px rgba(245,166,35,.32)}
    .page-head .eyebrow{font-family:var(--mono);font-size:12px;color:var(--ink-soft);letter-spacing:.08em;
      text-transform:uppercase}
    .page-head h1{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.01em;margin-top:6px}
    .toolbar{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap}
    .search{position:relative;flex:1;min-width:200px}
    .search svg{position:absolute;left:13px;top:12px;color:var(--brand)}
    .search input{width:100%;padding:11px 12px 11px 38px;border-radius:11px;border:1px solid var(--line);
      font-size:14px;color:var(--ink);background:var(--panel);transition:border-color .15s,box-shadow .15s}
    .search input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}

    .pop-list{display:grid;gap:11px}
    .pop-card{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;background:var(--panel);
      border:1px solid var(--line);border-radius:14px;padding:15px 17px;text-align:left;width:100%;
      transition:transform .12s,box-shadow .12s,border-color .12s;box-shadow:0 1px 2px rgba(27,20,48,.03)}
    .pop-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(27,20,48,.09);border-color:#D9CFF0}
    .pop-card:active{transform:translateY(0)}
    .pop-ico{width:42px;height:42px;border-radius:11px;background:var(--brand-soft);display:grid;place-items:center;
      color:var(--brand);flex-shrink:0}
    .pop-card.alerta .pop-ico{background:var(--amber-soft);color:var(--amber-deep)}
    .pop-card .meta-top{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap}
    .pop-card .pid{font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
    .pop-card .nome{font-size:15px;font-weight:700;line-height:1.3}
    .pop-card .meta-bot{display:flex;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap}
    .pop-card .sub{font-size:12.5px;color:var(--ink-soft)}
    .pop-card .leram{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
    .pop-card .leram.full{color:var(--green)}
    .chev{color:var(--brand);opacity:.5;flex-shrink:0}
    .pop-card:hover .chev{opacity:1}

    .badge-pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;
      letter-spacing:.02em;text-transform:uppercase;padding:3px 8px;border-radius:5px;font-weight:600}
    .b-vigente{background:var(--green-soft);color:var(--green)}
    .b-revisar{background:var(--amber-soft);color:var(--amber-deep)}
    .b-rascunho{background:#EEEBF6;color:var(--ink-soft)}
    .b-aprovacao{background:#E8EEFC;color:#3A6FB0}
    .b-alto{background:var(--red-soft);color:var(--red)}
    .b-medio{background:var(--amber-soft);color:var(--amber-deep)}

    .welcome{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:32px}
    .welcome h1{font-size:22px;margin-bottom:8px}
    .welcome p{font-size:15px;color:var(--ink-soft);line-height:1.6;margin-bottom:20px}
    .note{font-family:var(--mono);font-size:12px;color:var(--brand);background:var(--brand-soft);
      border-radius:8px;padding:12px 14px;line-height:1.6}

    /* ---- POP detalhe ---- */
    .back-link{background:none;border:none;color:var(--ink-soft);font-size:13px;padding:0;margin-bottom:16px;font-weight:500}
    .faixa{display:flex;align-items:center;gap:10px;border-radius:10px;padding:12px 15px;margin-bottom:16px;flex-wrap:wrap}
    .faixa.pend{background:var(--amber-soft)}
    .faixa.ok{background:var(--green-soft)}
    .faixa .txt{flex:1;font-size:13px;min-width:140px}
    .btn-amber{background:var(--amber);color:#fff;border:none;border-radius:6px;padding:7px 13px;font-size:12px;font-weight:600}
    .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}
    .tab-btn{display:flex;align-items:center;gap:7px;background:none;border:none;border-bottom:2px solid transparent;
      color:var(--ink-soft);font-size:14px;font-weight:600;padding:8px 13px;margin-bottom:-1px}
    .tab-btn.active{border-bottom-color:var(--brand);color:var(--brand)}
    .doc-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px}
    .doc-sec{font-family:var(--mono);font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
    .doc-card p{font-size:14px;line-height:1.7;margin-bottom:16px}
    .doc-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}

    /* editor */
    .editor-hint{font-size:12px;color:var(--ink-soft);background:var(--brand-soft);border-radius:9px;
      padding:10px 13px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
    .pop-editor{width:100%;min-height:340px;padding:18px;border-radius:12px;border:1px solid var(--line);
      font-family:var(--mono);font-size:13.5px;line-height:1.7;color:var(--ink);background:var(--panel);
      resize:vertical}
    .pop-editor:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}

    /* timeline de versões */
    .ver-timeline{position:relative;padding-left:26px}
    .ver-timeline::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:var(--line)}
    .ver-item{position:relative;margin-bottom:16px}
    .ver-dot{position:absolute;left:-26px;top:5px;width:14px;height:14px;border-radius:99px;
      background:var(--panel);border:2px solid var(--line)}
    .ver-dot.atual{background:var(--brand);border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
    .ver-body{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px 16px}
    .ver-head{display:flex;align-items:center;gap:10px;margin-bottom:5px;flex-wrap:wrap}
    .ver-num{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--brand)}
    .ver-data{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink-soft)}
    .ver-nota{font-size:14px;margin-bottom:5px}
    .ver-autor{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft)}

    /* Novo POP — cartões de opção */
    .opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:26px}
    .opt-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;text-align:left;
      cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s}
    .opt-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(27,20,48,.09);border-color:var(--brand)}
    .opt-card .oi{width:48px;height:48px;border-radius:13px;background:var(--brand-soft);color:var(--brand);
      display:grid;place-items:center;margin-bottom:14px}
    .opt-card h3{font-size:16px;font-weight:700;margin-bottom:6px}
    .opt-card p{font-size:13px;color:var(--ink-soft);line-height:1.5}
    .opt-card.soon{opacity:.55}
    .opt-card.soon:hover{transform:none;box-shadow:none;border-color:var(--line);cursor:default}
    .model-row{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);
      border-radius:11px;padding:13px 15px;margin-bottom:9px}
    .model-row .mi{width:36px;height:36px;border-radius:9px;background:var(--brand-soft);color:var(--brand);
      display:grid;place-items:center;flex-shrink:0}
    .model-row .mn{flex:1;font-size:14px;font-weight:600}
    @media (max-width:600px){ .opt-grid{grid-template-columns:1fr} .pop-editor{min-height:260px;font-size:13px} }

    /* leitura */
    .stat-row{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
    .stat{flex:1;min-width:150px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:15px 17px}
    .stat .num{font-family:var(--mono);font-size:28px;font-weight:700}
    .stat .num small{font-size:15px;color:var(--ink-soft)}
    .stat .lbl{font-size:13px;color:var(--ink-soft);margin-top:2px}
    .sec-label{font-family:var(--mono);font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
    .read-list{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:22px}
    .read-item{display:flex;align-items:center;gap:12px;padding:12px 15px;border-top:1px solid var(--line)}
    .read-item:first-child{border-top:none}
    .read-item .av{width:34px;height:34px;border-radius:99px;background:var(--brand);display:grid;place-items:center;
      color:#fff;font-family:var(--mono);font-size:12px;font-weight:700;flex-shrink:0}
    .read-item .who{flex:1}
    .read-item .who .n{font-size:14px;font-weight:600}
    .read-item .who .c{font-size:12px;color:var(--ink-soft)}
    .read-item .when{text-align:right;font-family:var(--mono);font-size:12px}
    .read-item .when .v{color:var(--green);font-size:11px;margin-top:2px}
    .pend-chips{display:flex;gap:10px;flex-wrap:wrap}
    .pend-chip{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px dashed rgba(181,112,26,.4);
      border-radius:10px;padding:9px 13px}
    .pend-chip .av{width:30px;height:30px;border-radius:99px;background:var(--amber-soft);display:grid;place-items:center;
      color:var(--amber);font-family:var(--mono);font-size:11px;font-weight:700}
    .pend-chip .n{font-size:13px;font-weight:600}
    .pend-chip .c{font-size:11px;color:var(--ink-soft)}

    /* ---- Equipe ---- */
    .team-list{display:grid;gap:10px}
    .team-card{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;background:var(--panel);
      border:1px solid var(--line);border-radius:11px;padding:14px 17px}
    .team-card.inativo{opacity:.6}
    .team-card .av{width:40px;height:40px;border-radius:99px;background:var(--brand);display:grid;place-items:center;
      color:#fff;font-family:var(--mono);font-size:13px;font-weight:700;flex-shrink:0}
    .team-card .nome{font-size:15px;font-weight:600}
    .team-card .sub{font-size:12px;color:var(--ink-soft);margin-top:2px}
    .team-card .acts{display:flex;gap:6px}
    .icon-btn{background:none;border:1px solid var(--line);border-radius:8px;padding:7px;color:var(--ink-soft);
      display:grid;place-items:center}
    .role-tag{display:inline-block;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.03em;
      padding:2px 7px;border-radius:4px;font-weight:600}
    .role-rt{background:var(--brand-soft);color:var(--brand)}
    .role-editor{background:#EAF0FA;color:#3A6FB0}
    .role-leitor{background:#EEF1F0;color:var(--ink-soft)}
    .team-toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);margin-bottom:16px}

    /* modal / formulário */
    .modal-bg{position:fixed;inset:0;background:rgba(8,42,46,.45);display:flex;align-items:flex-start;
      justify-content:center;padding:24px 16px;overflow:auto;z-index:50}
    .modal{background:var(--panel);border-radius:16px;width:100%;max-width:520px;padding:26px;margin-top:20px}
    .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
    .modal-head h2{font-size:20px;font-weight:700}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .form-grid .full{grid-column:1/-1}
    .fld label{display:block;font-size:12px;font-weight:600;margin-bottom:5px}
    .fld input,.fld select{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--line);
      font-size:14px;color:var(--ink);background:var(--panel)}
    .fld input:focus,.fld select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
    .fld .hint{font-size:11px;color:var(--ink-soft);margin-top:4px}
    .req{color:var(--red)}
    .modal-actions{display:flex;gap:10px;margin-top:22px}
    .role-help{background:var(--brand-soft);border-radius:8px;padding:12px 14px;font-size:12px;
      color:var(--brand-deep);line-height:1.6;margin-top:6px}
    @media (max-width:520px){ .form-grid{grid-template-columns:1fr} }

    /* ---- responsivo ---- */
    /* Tablet e abaixo: troca sidebar por barra inferior */
    @media (max-width:900px){
      .login-brand{display:none}
      .logo-mobile{display:flex}

  // Formata "2026-07-22T09:14:00Z" em "22/07/2026 · 09:14"
  function fmtDataHora(iso){
    const d = new Date(iso);
    const p = (n) => String(n).padStart(2,"0");
    return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} · ${p(d.getHours())}:${p(d.getMinutes())}`;
  }
  function fmtData(iso){
    const d = new Date(iso + (iso.length <= 10 ? "T00:00:00" : ""));
    const p = (n) => String(n).padStart(2,"0");
    return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()}`;
  }
  const escapeHtml = (s) => String(s).replace(/[&<>"']/g, m =>
    ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));

  // Valida CPF pelos dígitos verificadores (peso jurídico do registro).
  function cpfValido(cpf){
    const s = String(cpf).replace(/\D/g, "");
    if (s.length !== 11 || /^(\d)\1{10}$/.test(s)) return false;
    let soma = 0;
    for (let i = 0; i < 9; i++) soma += parseInt(s[i]) * (10 - i);
    let d1 = 11 - (soma % 11); if (d1 >= 10) d1 = 0;
    if (d1 !== parseInt(s[9])) return false;
    soma = 0;
    for (let i = 0; i < 10; i++) soma += parseInt(s[i]) * (11 - i);
    let d2 = 11 - (soma % 11); if (d2 >= 10) d2 = 0;
    return d2 === parseInt(s[10]);
  }
  // Formata "12345678901" → "123.456.789-01"
  function mascaraCpf(v){
    const s = String(v).replace(/\D/g, "").slice(0, 11);
    return s.replace(/(\d{3})(\d)/, "$1.$2").replace(/(\d{3})(\d)/, "$1.$2").replace(/(\d{3})(\d{1,2})$/, "$1-$2");
  }

  // Render simples do conteúdo: "## Título" vira seção, resto vira parágrafo.
  function renderConteudo(texto){
    const linhas = String(texto||"").split("\n");
    let html = "", buffer = [];
    const flush = () => { if (buffer.length){ html += `<p>${escapeHtml(buffer.join(" ")).trim()}</p>`; buffer=[]; } };
    linhas.forEach(ln => {
      const t = ln.trim();
      if (t.startsWith("## ")){ flush(); html += `<div class="doc-sec">${escapeHtml(t.slice(3))}</div>`; }
      else if (t === ""){ flush(); }
      else buffer.push(t);

  ============================================================ */
  const Auth = {
    perfil: null,
    estabelecimento: null,

    _carregarContexto(perfilId){
      this.perfil = MOCK.perfis.find(p => p.id === perfilId) || null;
      this.estabelecimento = this.perfil
        ? MOCK.estabelecimentos.find(e => e.id === this.perfil.estabelecimento_id) || null
        : null;
    },

    async entrarComEmail(email, senha){
      if (MODO_MOCK){
        const u = MOCK.logins.find(x => x.email === email.trim().toLowerCase() && x.senha === senha);
        if (!u) return { erro:"E-mail ou senha incorretos." };
        this._carregarContexto(u.perfil_id);
        return {};
      }
      const { error } = await sb.auth.signInWithPassword({ email, password:senha });
      if (error) return { erro:error.message };
      await this._hidratarReal();
      return {};
    },

    async entrarComGoogle(){
      if (MODO_MOCK){ this._carregarContexto("perfil-1"); return {}; }
      const { error } = await sb.auth.signInWithOAuth({
        provider:"google", options:{ redirectTo:window.location.origin }
      });
      return error ? { erro:error.message } : {};
    },

    async _hidratarReal(){
      const { data:{ user } } = await sb.auth.getUser();
      if (!user) return;
      const { data:p } = await sb.from("perfis").select("*").eq("user_id",user.id).single();
      this.perfil = p;
      if (p){
        const { data:e } = await sb.from("estabelecimentos").select("*").eq("id",p.estabelecimento_id).single();
        this.estabelecimento = e;
      }
    },

    async sair(){
      if (!MODO_MOCK) await sb.auth.signOut();
      this.perfil = null; this.estabelecimento = null;
      render();
    },
  };

    const map = {

        <div class="page-head-row">
          <div class="page-icon">${ic.folder}</div>
          <div>
            <div class="eyebrow">${escapeHtml(e.nome||"")} · Unidade ${escapeHtml(e.cidade||"")}</div>
            <h1 style="margin-top:2px">Biblioteca de POPs</h1>
          </div>
        </div>
      </div>
      <div class="toolbar">
        <div class="search">${ic.search}<input id="in-busca" placeholder="Buscar procedimento…" value="${escapeHtml(App.busca)}"></div>
        <button class="btn btn-primary" id="btn-novo">${ic.plus} Novo POP</button>
      </div>
      <div class="pop-list">${cards || `<p style="color:var(--ink-soft);padding:20px 0">Nenhum procedimento encontrado.</p>`}</div>`;
  }

  // ---- Tela: POP (documento + leitura) ----
  function viewPop(){
    const e = Auth.estabelecimento || {};
    const p = DB.getPop(App.popId);
    if (!p) return `<button class="back-link" data-nav="biblioteca">← Biblioteca</button><p>POP não encontrado.</p>`;
    const leituras = DB.getLeituras(p.id, p.versao_atual);
    const equipe = totalEquipe(e.id);

    const faixa = App._leu
      ? `<div class="faixa ok">${ic.check}<span class="txt">Leitura confirmada por <strong>${escapeHtml(Auth.perfil.nome)}</strong> em ${fmtDataHora(new Date().toISOString())} · v${p.versao_atual}</span></div>`
      : `<div class="faixa pend">${ic.eye}<span class="txt">Você ainda não confirmou a leitura da versão vigente deste procedimento.</span><button class="btn-amber" id="btn-confirmar">Confirmar leitura</button></div>`;

    const totalLeram = leituras.length + (App._leu ? 1 : 0);

    let corpo;
    if (App.abaPop === "leitura"){
      corpo = viewLeitura(p, leituras, equipe, totalLeram);
    } else if (App.abaPop === "historico"){
      corpo = viewHistorico(p);
    } else if (App.editando){
      // EDITOR
      corpo = `
        <div class="editor-hint">${ic.edit} Use <strong>## Título</strong> para começar uma seção. Cada save gera uma nova versão.</div>
        <textarea id="pop-editor" class="pop-editor" spellcheck="true">${escapeHtml(App.rascunhoConteudo)}</textarea>
        <div class="fld" style="margin-top:12px"><label>Nota da alteração (opcional)</label>
          <input id="pop-nota" placeholder="Ex: revisão de redação da seção 2"></div>
        <div class="doc-actions">
          <button class="btn btn-primary" id="btn-salvar-versao">${ic.check} Salvar nova versão</button>
          <button class="btn" id="btn-cancelar-edicao">Cancelar</button>
        </div>`;
    } else {
      // VISUALIZAÇÃO
      const acoes = [];
      if (pode("editar")) acoes.push(`<button class="btn" id="btn-editar">${ic.edit} Editar</button>`);
      if (pode("aprovar") && (p.status==="aprovacao" || p.status==="rascunho"))
        acoes.push(`<button class="btn btn-primary" id="btn-aprovar">${ic.check} Aprovar e publicar</button>`);
      if (pode("editar") && p.status==="rascunho")
        acoes.push(`<button class="btn" id="btn-enviar-aprovacao">${ic.share} Enviar para aprovação</button>`);
      acoes.push(`<button class="btn" id="btn-distribuir">${ic.share} Distribuir</button>`);
      acoes.push(`<button class="btn" id="btn-pdf">${ic.download} PDF</button>`);
      corpo = `
        <div class="doc-card">${renderConteudo(p.conteudo)}</div>
        <div class="doc-actions">${acoes.join("")}</div>`;
    }

    return `
      <button class="back-link" data-nav="biblioteca">← Biblioteca</button>
      <div class="meta-top" style="margin-bottom:6px">
        <span class="pid">${p.id}</span>${badge(p.status)}
        <span class="pid">v${p.versao_atual}</span>
      </div>
      <h1 style="font-family:var(--display);font-size:22px;font-weight:700;margin-bottom:16px;letter-spacing:-.01em">${escapeHtml(p.nome)}</h1>
      ${App.editando ? "" : faixa}
      <div class="tabs">
        <button class="tab-btn ${App.abaPop==="documento"?"active":""}" data-aba="documento">${ic.file} Documento</button>
        <button class="tab-btn ${App.abaPop==="leitura"?"active":""}" data-aba="leitura">${ic.eye} Leitura (${totalLeram}/${equipe})</button>
        <button class="tab-btn ${App.abaPop==="historico"?"active":""}" data-aba="historico">${ic.history} Histórico</button>
      </div>
      ${corpo}`;
  }

  // ---- Aba: Histórico de versões ----
  function viewHistorico(p){
    const versoes = DB.getVersoes(p.id);
    if (!versoes.length) return '<p style="color:var(--ink-soft)">Sem histórico de versões.</p>';
    const itens = versoes.map(v => `
      <div class="ver-item">
        <div class="ver-dot ${v.vigente?"atual":""}"></div>
        <div class="ver-body">
          <div class="ver-head">
            <span class="ver-num">v${v.numero}</span>
            ${v.vigente?'<span class="badge-pill b-vigente">versão vigente</span>':""}
            <span class="ver-data">${fmtData(v.criado_em.slice(0,10))}</span>
          </div>
          <div class="ver-nota">${escapeHtml(v.nota)}</div>
          <div class="ver-autor">${ic.user2} ${escapeHtml(v.autor_nome)}</div>
        </div>
      </div>`).join("");
    return `<div class="ver-timeline">${itens}</div>`;
  }

  function viewLeitura(p, leituras, equipe, totalLeram){
    const e = Auth.estabelecimento || {};
    let registros = leituras.slice();
    if (App._leu){
      registros.unshift({ leitor_nome:Auth.perfil.nome, leitor_cargo:"Responsável técnica",
        iniciais:Auth.perfil.iniciais, confirmado_em:new Date().toISOString(), versao_numero:p.versao_atual, voce:true });
    }
    const lista = registros.map(l => `
      <div class="read-item" ${l.voce?'style="background:var(--brand-soft)"':""}>
        <div class="av">${escapeHtml(l.iniciais || iniciaisDe(l.leitor_nome))}</div>
        <div class="who"><div class="n">${escapeHtml(l.leitor_nome)}${l.voce?' <span style="font-family:var(--mono);font-size:10px;color:var(--brand)">· você</span>':""}</div>
          <div class="c">${escapeHtml(l.leitor_cargo)}</div></div>
        <div class="when"><div>${ic.clock} ${fmtDataHora(l.confirmado_em)}</div><div class="v">leu v${l.versao_numero}</div></div>
      </div>`).join("");

    const pendentes = DB.getPendentes(p.id, p.versao_atual, e.id)
      .filter(c => !(App._leu && c.id === (Auth.perfil.colaborador_id)))
      .map(c => `
        <div class="pend-chip">
          <div class="av">${escapeHtml(c.iniciais)}</div>
          <div><div class="n">${escapeHtml(c.nome)}</div><div class="c">${escapeHtml(c.cargo)}</div></div>
          <button class="btn-amber" style="margin-left:6px">Lembrar</button>
        </div>`).join("");

    return `
      <div class="stat-row">
        <div class="stat"><div class="num" style="color:var(--green)">${totalLeram}<small>/${equipe}</small></div><div class="lbl">confirmaram leitura</div></div>
        <div class="stat"><div class="num" style="color:var(--amber)">${equipe-totalLeram}</div><div class="lbl">leitura pendente</div></div>
      </div>
      <div class="sec-label">Registro de leitura</div>
      <div class="read-list">${lista || '<div style="padding:16px;color:var(--ink-soft);font-size:13px">Ninguém confirmou ainda.</div>'}</div>
      <div class="sec-label">Aguardando leitura</div>
      <div class="pend-chips">${pendentes || '<div style="color:var(--ink-soft);font-size:13px">Todos leram. ✓</div>'}</div>`;
  }

  // ---- Tela: Alertas ----
  function viewAlertas(){
    const e = Auth.estabelecimento || {};
    const alertas = DB.listarAlertas(e.segmento || "farmacia");
    const cards = alertas.map(a => `
      <div style="background:var(--panel);border:1px solid var(--line);border-left:3px solid ${a.grau==="alto"?"var(--red)":"var(--amber)"};border-radius:10px;padding:17px 19px;margin-bottom:12px">
        <div class="meta-top">
          <span style="font-family:var(--mono);font-size:13px;font-weight:700">${escapeHtml(a.norma)}</span>
          <span class="badge-pill b-${a.grau}">impacto ${a.grau}</span>
          <span style="margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink-soft)">${fmtData(a.publicado_em)}</span>
        </div>
        <p style="font-size:15px;margin:8px 0 12px">${escapeHtml(a.tema)}</p>
        ${a.pop_afetado_id?`<div style="display:flex;align-items:center;gap:8px;background:var(--amber-soft);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--amber)">${ic.warn} Documento afetado: <strong>${a.pop_afetado_id}</strong>
          <button class="btn-amber" style="margin-left:auto" data-pop="${a.pop_afetado_id}">Revisar agora</button></div>`:""}
      </div>`).join("");
    return `
      <div class="page-head"><div class="page-head-row"><div class="page-icon amber">${ic.shieldc}</div>
        <div><h1 style="margin-top:0">Alertas regulatórios</h1>
        <p style="font-size:13px;color:var(--ink-soft);margin-top:3px">Mudanças normativas que afetam os documentos da sua farmácia.</p></div></div></div>
      ${cards}
      <div style="margin-top:16px;text-align:center;font-family:var(--mono);font-size:11px;color:var(--ink-soft);padding:16px;border:1px dashed var(--line);border-radius:10px">
        Monitoramento curado pela equipe DocFlow · fontes oficiais ANVISA e Vigilância Sanitária</div>`;
  }

  // ---- Tela: Equipe ----
  function roleTag(papel){
    const map = { responsavel_tecnico:["role-rt","RT"], editor:["role-editor","Editor"], leitor:["role-leitor","Leitor"] };
    const [cls,txt] = map[papel] || map.leitor;
    return `<span class="role-tag ${cls}">${txt}</span>`;
  }

    const e = Auth.estabelecimento || {};

  // ---- Tela: Novo POP ----
  function viewNovoPop(){
    const modo = App.novoPop && App.novoPop.modo;
    if (modo === "modelo"){
      const modelos = DB.listarModelos().map(m => `
        <div class="model-row">
          <div class="mi">${iconePop(m.categoria)}</div>
          <div class="mn">${escapeHtml(m.nome)}<div style="font-size:12px;color:var(--ink-soft);font-weight:400">${escapeHtml(m.categoria)}</div></div>
          <button class="btn btn-primary" data-modelo="${m.id}">Usar ${ic.arrow}</button>
        </div>`).join("");
      return `
        <button class="back-link" id="novo-voltar">← Voltar</button>
        <div class="page-head"><div class="page-head-row"><div class="page-icon">${ic.template}</div>
          <div><h1 style="margin-top:0">Escolher modelo</h1>
          <p style="font-size:13px;color:var(--ink-soft);margin-top:3px">Parta de um POP pronto e adapte à sua farmácia.</p></div></div></div>

    if (modo === "branco"){
      return `

            <input id="np-nome" placeholder="Ex: Fracionamento de medicamentos"></div>
          <div class="fld"><label>Categoria</label>

          <div class="doc-actions" style="margin-top:18px">
            <button class="btn btn-primary" id="np-criar">Criar e editar ${ic.arrow}</button>
          </div>
        </div>`;

    return `
      <button class="back-link" data-nav="biblioteca">← Biblioteca</button>
      <div class="page-head"><div class="page-head-row"><div class="page-icon">${ic.plus}</div>

          <p>Suba um POP em Word ou PDF que você já tem. Numa próxima versão.</p>

  /* ============================================================
     RENDER + EVENTOS
  ============================================================ */
  const root = document.getElementById("root");

  function render(){
    if (!Auth.perfil){
      root.innerHTML = viewLogin();
      ligarLogin();
      return;
    }
    // App logado: escolhe a tela interna
    let inner;
    if (App.tela === "pop") inner = viewPop();
    else if (App.tela === "novopop") inner = viewNovoPop();
    else if (App.tela === "alertas") inner = viewAlertas();
    else if (App.tela === "planos") inner = viewPlanos();
    else if (App.tela === "equipe") inner = viewEquipe();
    else inner = viewBiblioteca();

    root.innerHTML = viewApp(inner);
    ligarApp();
  }

  function ligarApp(){
    // Sair
    const btnSair = document.getElementById("btn-sair");
    if (btnSair) btnSair.onclick = () => { App.tela="biblioteca"; App.popId=null; App._leu=false; Auth.sair(); };

    // Navegação (sidebar, tabbar, back-links, botões data-nav)
    document.querySelectorAll("[data-nav]").forEach(el => {
      el.onclick = () => { App._leu=false; irPara(el.getAttribute("data-nav")); };
    });

    // Abrir POP (cards e botões "revisar" com data-pop)
    document.querySelectorAll("[data-pop]").forEach(el => {
      el.onclick = (ev) => { ev.stopPropagation(); App._leu=false; irPara("pop", el.getAttribute("data-pop")); };
    });

    // Busca na biblioteca
    const busca = document.getElementById("in-busca");
    if (busca){
      busca.oninput = () => { App.busca = busca.value; };
      busca.onkeyup = (e) => {
        // re-render preservando foco/cursor
        const pos = busca.selectionStart;
        render();
        const nb = document.getElementById("in-busca");
        if (nb){ nb.focus(); nb.setSelectionRange(pos,pos); }
      };
    }

    // Novo POP → tela de criação
    const btnNovo = document.getElementById("btn-novo");
    if (btnNovo) btnNovo.onclick = () => { App.novoPop = {}; App.novoErro = null; irPara("novopop"); };

    // ---- Novo POP: escolha de caminho ----
    document.querySelectorAll("[data-modo]").forEach(el => {
      el.onclick = () => { App.novoPop = { modo: el.getAttribute("data-modo") }; App.novoErro = null; render(); };
    });
    const novoVoltar = document.getElementById("novo-voltar");
    if (novoVoltar) novoVoltar.onclick = () => { App.novoPop = {}; App.novoErro = null; render(); };

    // usar modelo → cria POP e abre editor
    document.querySelectorAll("[data-modelo]").forEach(el => {
      el.onclick = () => {
        const m = DB.listarModelos().find(x => x.id === el.getAttribute("data-modelo"));
        if (!m) return;
        const pop = DB.criarPop({ nome:m.nome, categoria:m.categoria, origem:"modelo", conteudo:m.conteudo });
        App.novoPop = null;
        App.popId = pop.id; App.tela = "pop"; App.abaPop = "documento";
        App.editando = true; App.rascunhoConteudo = pop.conteudo;
        render();
      };
    });

    // criar do zero
    const npCriar = document.getElementById("np-criar");
    if (npCriar) npCriar.onclick = () => {
      const nome = (document.getElementById("np-nome").value||"").trim();
      const cat = (document.getElementById("np-cat").value||"").trim() || "Geral";
      if (!nome){ App.novoErro = "Informe o nome do procedimento."; render(); return; }
      const pop = DB.criarPop({ nome, categoria:cat, origem:"ia" });
      App.novoPop = null;
      App.popId = pop.id; App.tela = "pop"; App.abaPop = "documento";
      App.editando = true; App.rascunhoConteudo = pop.conteudo;
      render();
    };

    // ---- Editor de POP ----
    const btnEditar = document.getElementById("btn-editar");
    if (btnEditar) btnEditar.onclick = () => {
      const p = DB.getPop(App.popId);
      App.editando = true; App.rascunhoConteudo = p ? p.conteudo : ""; render();
      const ta = document.getElementById("pop-editor"); if (ta) ta.focus();
    };
    // manter o buffer sincronizado ao digitar
    const editor = document.getElementById("pop-editor");
    if (editor) editor.oninput = () => { App.rascunhoConteudo = editor.value; };

    const btnSalvarV = document.getElementById("btn-salvar-versao");
    if (btnSalvarV) btnSalvarV.onclick = () => {
      const nota = (document.getElementById("pop-nota").value||"").trim();
      DB.salvarNovaVersao(App.popId, App.rascunhoConteudo, nota);
      App.editando = false; App._leu = false;
      render();
    };
    const btnCancelarEd = document.getElementById("btn-cancelar-edicao");
    if (btnCancelarEd) btnCancelarEd.onclick = () => { App.editando = false; render(); };

    // ---- Aprovação / status ----
    const btnEnviarAp = document.getElementById("btn-enviar-aprovacao");
    if (btnEnviarAp) btnEnviarAp.onclick = () => { DB.definirStatus(App.popId, "aprovacao"); render(); };
    const btnAprovar = document.getElementById("btn-aprovar");
    if (btnAprovar) btnAprovar.onclick = () => { DB.definirStatus(App.popId, "vigente"); render(); };

    // Distribuir / PDF (próximas etapas — avisos por enquanto)
    const btnDist = document.getElementById("btn-distribuir");
    if (btnDist) btnDist.onclick = () => alert("Distribuição por link/QR — próxima etapa (A4).");
    const btnPdf = document.getElementById("btn-pdf");
    if (btnPdf) btnPdf.onclick = () => alert("Exportar PDF — próxima etapa (A6).");

    // Abas do POP
    document.querySelectorAll("[data-aba]").forEach(el => {
      el.onclick = () => { App.abaPop = el.getAttribute("data-aba"); render(); };
    });

    // Confirmar leitura
    const btnConf = document.getElementById("btn-confirmar");
    if (btnConf) btnConf.onclick = () => { App._leu = true; render(); };

    // ---- Equipe ----
    const chkInativos = document.getElementById("chk-inativos");
    if (chkInativos) chkInativos.onchange = () => { App.mostrarInativos = chkInativos.checked; render(); };

    const btnNovoFunc = document.getElementById("btn-novo-func");
    if (btnNovoFunc) btnNovoFunc.onclick = () => { App.funcEdit = {}; App.funcErro = null; render(); };

    document.querySelectorAll("[data-editfunc]").forEach(el => {
      el.onclick = () => { App.funcEdit = Object.assign({}, DB.getFuncionario(el.getAttribute("data-editfunc"))); App.funcErro = null; render(); };
    });
    document.querySelectorAll("[data-inativar]").forEach(el => {
      el.onclick = () => { if (confirm("Inativar este funcionário? O histórico de leitura é preservado.")){ DB.inativarFuncionario(el.getAttribute("data-inativar")); render(); } };
    });
    document.querySelectorAll("[data-reativar]").forEach(el => {
      el.onclick = () => { DB.reativarFuncionario(el.getAttribute("data-reativar")); render(); };
    });

    // Formulário de funcionário
    const fecharForm = () => { App.funcEdit = null; App.funcErro = null; render(); };
    const bg = document.getElementById("modal-bg");
    if (bg) bg.onclick = (ev) => { if (ev.target === bg) fecharForm(); };
    const btnFechar = document.getElementById("func-fechar");
    if (btnFechar) btnFechar.onclick = fecharForm;
    const btnCancelar = document.getElementById("func-cancelar");
    if (btnCancelar) btnCancelar.onclick = fecharForm;

    // máscara de CPF ao digitar
    const inCpf = document.getElementById("f-cpf");
    if (inCpf) inCpf.oninput = () => { const pos = inCpf.selectionStart; inCpf.value = mascaraCpf(inCpf.value); };

    const btnSalvar = document.getElementById("func-salvar");
    if (btnSalvar) btnSalvar.onclick = () => {
      const get = (id) => (document.getElementById(id).value || "").trim();
      const dados = {
        nome: get("f-nome"), cpf: get("f-cpf"), cargo: get("f-cargo"),
        papel: get("f-papel"), crf: get("f-crf"), email: get("f-email"),
        telefone: get("f-tel"), admissao: get("f-adm"),
      };
      // validações
      if (!dados.nome){ App.funcErro = "Informe o nome completo."; render(); return; }
      if (!cpfValido(dados.cpf)){ App.funcErro = "CPF inválido. Verifique os números."; render(); return; }
      if (!dados.cargo){ App.funcErro = "Informe o cargo."; render(); return; }
      if (!dados.email || !dados.email.includes("@")){ App.funcErro = "Informe um e-mail válido."; render(); return; }
      if (!dados.telefone){ App.funcErro = "Informe o telefone."; render(); return; }
      if (!dados.admissao){ App.funcErro = "Informe a data de admissão."; render(); return; }
      // CPF duplicado
      const e = Auth.estabelecimento || {};
      const dup = DB.listarFuncionarios(e.id, true).find(c => c.cpf === dados.cpf && c.id !== (App.funcEdit && App.funcEdit.id));
      if (dup){ App.funcErro = "Já existe um funcionário com este CPF."; render(); return; }

      if (App.funcEdit && App.funcEdit.id) dados.id = App.funcEdit.id;
      DB.salvarFuncionario(dados);
      App.funcEdit = null; App.funcErro = null;
      render();
    };
  }

  function ligarLogin(){
    const form = document.getElementById("form-login");
    const btnEntrar = document.getElementById("btn-entrar");
    const btnGoogle = document.getElementById("btn-google");
    const errBox = document.getElementById("login-err");

    form.onsubmit = async (ev) => {
      ev.preventDefault();
      errBox.innerHTML = "";
      btnEntrar.disabled = true;
      btnEntrar.innerHTML = ic.loader;
      const email = document.getElementById("in-email").value;
      const senha = document.getElementById("in-senha").value;
      const { erro } = await Auth.entrarComEmail(email, senha);
      if (erro){
        errBox.innerHTML = `<div class="err">${erro}</div>`;
        btnEntrar.disabled = false;
        btnEntrar.innerHTML = `Entrar ${ic.arrow}`;
      } else {
        render();
      }
    };

    btnGoogle.onclick = async () => {
      btnGoogle.disabled = true;
      btnGoogle.innerHTML = ic.loader + " Conectando…";
      const { erro } = await Auth.entrarComGoogle();
      if (erro){
        errBox.innerHTML = `<div class="err">${erro}</div>`;
        btnGoogle.disabled = false;
        btnGoogle.innerHTML = `${ic.google} Continuar com Google`;
      } else if (MODO_MOCK){
        render();
      }
    };
  }

  // Inicialização: no modo real, recupera sessão existente.
  (async function init(){
    try {
      if (!MODO_MOCK && sb){
        const { data } = await sb.auth.getSession();
        if (data && data.session) await Auth._hidratarReal();
      }
    } catch (e) {
      console.log("[DocFlow] erro ao inicializar sessão:", e && e.message);
    }
    render();
  })();
  </script>
</body>
</html>
