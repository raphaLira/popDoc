<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#820AD1" />
  <title>DocFlow AI — Gestão de POPs</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ============================================================
       DocFlow AI — estilos
       Identidade clínica: verde de saúde pública, tipografia técnica.
    ============================================================ */
    :root{
      /* superfícies — branco puro, cinzas neutros (não tingidos) */
      --bg:#FFFFFF; --panel:#FFFFFF; --panel-2:#F7F7F8; --panel-3:#F2F2F4;
      --ink:#191423; --ink-soft:#75717E; --ink-faint:#A9A5B0;
      --line:#ECEBEF; --line-soft:#F4F3F6;
      /* marca — roxo Nubank, usado com parcimônia */
      --brand:#820AD1; --brand-hover:#6D08B0; --brand-deep:#3D0563; --brand-noite:#2A0345;
      --brand-soft:#F3E5FB; --brand-tint:#FAF3FE;
      /* status — versões pastel */
      --green:#12A150; --green-soft:#E6F6EC;
      --amber:#E8890C; --amber-deep:#B96A05; --amber-soft:#FDF0DC;
      --red:#E5484D; --red-soft:#FCEBEC;
      --blue:#2E7CE4; --blue-soft:#E7F0FD;
      /* círculos pastel para ícones (padrão Nubank) */
      --c-roxo:#F3E5FB; --c-roxo-ink:#820AD1;
      --c-verde:#E2F5EA; --c-verde-ink:#12A150;
      --c-ambar:#FCEFDA; --c-ambar-ink:#C77905;
      --c-azul:#E5EFFC; --c-azul-ink:#2E7CE4;
      --c-rosa:#FCE7F1; --c-rosa-ink:#D6357F;
      --c-cinza:#F0EFF2; --c-cinza-ink:#75717E;
      /* tipografia — só Inter */
      --sans:'Inter',system-ui,-apple-system,sans-serif;
      --display:'Inter',system-ui,sans-serif;
      --mono:'Inter',system-ui,sans-serif;
      /* espaço */
      --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
      /* raios generosos (Nubank) e sombras suaves */
      --r1:10px; --r2:14px; --r3:18px; --r4:24px; --r-pill:999px;
      --sh1:0 1px 3px rgba(25,20,35,.05);
      --sh2:0 4px 20px rgba(25,20,35,.07);
      --sh3:0 12px 40px rgba(25,20,35,.12);
      --ring:0 0 0 3px rgba(130,10,209,.15);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--sans);background:var(--panel-2);color:var(--ink);
      -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden;
      font-size:15px;line-height:1.5;letter-spacing:-.01em}
    @media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
    .content, .pop-card, .team-card{min-width:0}
    .pop-card .nome, .team-card .nome, .pop-card .sub, .team-card .sub{overflow-wrap:anywhere}
    button{font-family:inherit;cursor:pointer}
    input{font-family:inherit}
    a{color:var(--brand);text-decoration:none}
    .hidden{display:none !important}
    @keyframes spin{to{transform:rotate(360deg)}}
    .spin{animation:spin 1s linear infinite}

    /* ---- Login ---- */
    .login-wrap{min-height:100vh;display:flex}
    .login-brand{flex:1;background:linear-gradient(170deg,var(--brand-noite) 0%,var(--brand-deep) 60%,#3A1A85 100%);padding:48px 44px;display:flex;
      flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
    .login-brand h1{color:#fff;font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:-.01em;line-height:1.2;margin-bottom:16px;max-width:420px}
    .login-brand p{color:#CBBEF0;font-size:15px;line-height:1.6;max-width:420px}
    .brand-logo{display:flex;align-items:center;gap:12px}
    .brand-logo .mark{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#8B5CFF,#6C3BF5);display:grid;place-items:center}
    .brand-logo .name{color:#fff;font-family:var(--display);font-size:18px;font-weight:700;line-height:1}
    .brand-logo .name span{color:#C9B6FF}
    .brand-logo .sub{font-family:var(--mono);font-size:9px;color:#9B8FC7;letter-spacing:.12em;margin-top:4px}
    .brand-foot{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:#9B8FC7}
    .circle{position:absolute;border-radius:999px;border:1px solid rgba(255,255,255,.05)}

    .login-form-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 24px}
    .login-card{width:100%;max-width:380px}
    .logo-mobile{display:none;align-items:center;gap:10px;margin-bottom:28px}
    .logo-mobile .mark{width:32px;height:32px;border-radius:8px;background:var(--brand);display:grid;place-items:center}
    .logo-mobile .name{font-size:17px;font-weight:700}
    .logo-mobile .name span{color:var(--brand)}
    .login-card h2{font-family:var(--display);font-size:23px;font-weight:700;margin-bottom:6px}
    .login-card .lead{font-size:14px;color:var(--ink-soft);margin-bottom:28px}

    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;
      font-size:14px;font-weight:600;padding:12px 16px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
    .btn-primary{background:linear-gradient(135deg,#7C4DFF,#6C3BF5);color:#fff;border:none;font-size:15px;
      padding:13px 16px;box-shadow:0 4px 14px rgba(108,59,245,.32)}
    .btn-primary:hover{background:linear-gradient(135deg,#6C3BF5,#5730C9)}
    .btn-block{width:100%}
    .btn:disabled{opacity:.65;cursor:default}

    .divider{display:flex;align-items:center;gap:12px;margin:20px 0}
    .divider .ln{flex:1;height:1px;background:var(--line)}
    .divider span{font-family:var(--mono);font-size:11px;color:var(--ink-soft)}

    label.field{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
    .input-wrap{position:relative;margin-bottom:14px}
    .input-wrap svg{position:absolute;left:12px;top:12px;color:var(--ink-soft);pointer-events:none}
    .input-wrap input{width:100%;padding:11px 12px 11px 38px;border-radius:10px;border:1px solid var(--line);
      font-size:14px;color:var(--ink);background:var(--panel);transition:border-color .15s,box-shadow .15s}
    .input-wrap input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}

    .err{background:var(--red-soft);color:var(--red);font-size:13px;padding:10px 12px;border-radius:8px;margin-bottom:16px}
    .demo-box{margin-top:24px;padding:12px 14px;border-radius:8px;background:var(--brand-soft);
      font-family:var(--mono);font-size:11px;color:var(--brand-deep);line-height:1.6}

    /* ---- App shell ---- */
    .app{min-height:100vh;display:flex;flex-direction:column}
    .topbar{display:flex;align-items:center;gap:12px;padding:14px 24px;background:linear-gradient(120deg,var(--brand-noite),var(--brand-deep))}
    .topbar .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#8B5CFF,#6C3BF5);display:grid;place-items:center}
    .topbar .name{color:#fff;font-family:var(--display);font-size:15px;font-weight:700}
    .topbar .name span{color:#C9B6FF}
    .topbar .estab{margin-left:auto;font-family:var(--mono);font-size:11px;color:#C9B6FF;text-align:right}
    .btn-logout{background:transparent;border:1px solid rgba(255,255,255,.2);color:#E8E0FA;border-radius:8px;
      padding:7px 12px;font-size:13px;display:flex;align-items:center;gap:6px;margin-left:16px}

    .body{flex:1;display:flex}

    /* sidebar (desktop) */
    .sidebar{width:230px;background:linear-gradient(180deg,var(--brand-deep),var(--brand-noite));padding:18px 14px;display:flex;flex-direction:column;gap:4px}
    .nav-item{display:flex;align-items:center;gap:11px;width:100%;padding:10px 13px;border-radius:8px;border:none;
      background:transparent;color:#C9BEE8;font-size:14px;font-weight:500;text-align:left}
    .nav-item.active{background:var(--brand-soft);color:var(--brand-deep);font-weight:600}
    .nav-item .badge{margin-left:auto;background:var(--amber);color:#fff;font-family:var(--mono);font-size:10px;
      font-weight:700;padding:1px 6px;border-radius:99px}
    .sidebar-foot{margin-top:auto;border-top:1px solid rgba(255,255,255,.08);padding-top:10px}
    .user-chip{display:flex;align-items:center;gap:10px;padding:10px 13px}
    .user-chip .av{width:30px;height:30px;border-radius:99px;background:linear-gradient(135deg,#8B5CFF,#6C3BF5);display:grid;place-items:center;
      color:#fff;font-family:var(--mono);font-size:12px;font-weight:700}
    .user-chip .nm{font-size:12px;font-weight:600;color:#fff}
    .user-chip .rl{font-family:var(--mono);font-size:10px;color:#9B8FC7}

    .content{flex:1;max-width:960px;margin:0 auto;width:100%;padding:28px 32px}

    /* bottom tab bar (mobile) */
    .tabbar{display:none;border-top:1px solid var(--line);background:var(--panel)}
    .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 6px;border:none;
      background:none;color:var(--ink-soft);position:relative}
    .tab.active{color:var(--brand)}
    .tab .lbl{font-size:10px;font-weight:600}
    .tab .dot{position:absolute;top:6px;right:calc(50% - 14px);width:7px;height:7px;border-radius:99px;
      background:var(--amber);border:1.5px solid var(--panel)}

    /* ---- Biblioteca ---- */
    .page-head{margin-bottom:22px}
    .page-head-row{display:flex;align-items:center;gap:13px}
    .page-icon{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,#7C4DFF,#6C3BF5);
      display:grid;place-items:center;color:#fff;flex-shrink:0;box-shadow:0 6px 16px rgba(108,59,245,.3)}
    .page-icon.amber{background:linear-gradient(135deg,#F7B733,#F5A623);box-shadow:0 6px 16px rgba(245,166,35,.32)}
    .page-head .eyebrow{font-family:var(--mono);font-size:12px;color:var(--ink-soft);letter-spacing:.08em;
      text-transform:uppercase}
    .page-head h1{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.01em;margin-top:6px}
    .toolbar{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap}
    .search{position:relative;flex:1;min-width:200px}
    .search svg{position:absolute;left:13px;top:12px;color:var(--brand)}
    .search input{width:100%;padding:11px 12px 11px 38px;border-radius:11px;border:1px solid var(--line);
      font-size:14px;color:var(--ink);background:var(--panel);transition:border-color .15s,box-shadow .15s}
    .search input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}

    .pop-list{display:grid;gap:11px}
    .pop-card{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;background:var(--panel);
      border:1px solid var(--line);border-radius:14px;padding:15px 17px;text-align:left;width:100%;
      transition:transform .12s,box-shadow .12s,border-color .12s;box-shadow:0 1px 2px rgba(27,20,48,.03)}
    .pop-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(27,20,48,.09);border-color:#D9CFF0}
    .pop-card:active{transform:translateY(0)}
    .pop-ico{width:42px;height:42px;border-radius:11px;background:var(--brand-soft);display:grid;place-items:center;
      color:var(--brand);flex-shrink:0}
    .pop-card.alerta .pop-ico{background:var(--amber-soft);color:var(--amber-deep)}
    .pop-card .meta-top{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap}
    .pop-card .pid{font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
    .pop-card .nome{font-size:15px;font-weight:700;line-height:1.3}
    .pop-card .meta-bot{display:flex;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap}
    .pop-card .sub{font-size:12.5px;color:var(--ink-soft)}
    .pop-card .leram{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
    .pop-card .leram.full{color:var(--green)}
    .chev{color:var(--brand);opacity:.5;flex-shrink:0}
    .pop-card:hover .chev{opacity:1}

    .badge-pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;
      letter-spacing:.02em;text-transform:uppercase;padding:3px 8px;border-radius:5px;font-weight:600}
    .b-vigente{background:var(--green-soft);color:var(--green)}
    .b-revisar{background:var(--amber-soft);color:var(--amber-deep)}
    .b-rascunho{background:#EEEBF6;color:var(--ink-soft)}
    .b-aprovacao{background:#E8EEFC;color:#3A6FB0}
    .b-alto{background:var(--red-soft);color:var(--red)}
    .b-medio{background:var(--amber-soft);color:var(--amber-deep)}

    .welcome{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:32px}
    .welcome h1{font-size:22px;margin-bottom:8px}
    .welcome p{font-size:15px;color:var(--ink-soft);line-height:1.6;margin-bottom:20px}
    .note{font-family:var(--mono);font-size:12px;color:var(--brand);background:var(--brand-soft);
      border-radius:8px;padding:12px 14px;line-height:1.6}

    /* ---- POP detalhe ---- */
    .back-link{background:none;border:none;color:var(--ink-soft);font-size:13px;padding:0;margin-bottom:16px;font-weight:500}
    .faixa{display:flex;align-items:center;gap:10px;border-radius:10px;padding:12px 15px;margin-bottom:16px;flex-wrap:wrap}
    .faixa.pend{background:var(--amber-soft)}
    .faixa.ok{background:var(--green-soft)}
    .faixa .txt{flex:1;font-size:13px;min-width:140px}
    .btn-amber{background:var(--amber);color:#fff;border:none;border-radius:6px;padding:7px 13px;font-size:12px;font-weight:600}
    .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}
    .tab-btn{display:flex;align-items:center;gap:7px;background:none;border:none;border-bottom:2px solid transparent;
      color:var(--ink-soft);font-size:14px;font-weight:600;padding:8px 13px;margin-bottom:-1px}
    .tab-btn.active{border-bottom-color:var(--brand);color:var(--brand)}
    .doc-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px}
    .doc-sec{font-family:var(--mono);font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
    .doc-card p{font-size:14px;line-height:1.7;margin-bottom:16px}
    .doc-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}

    /* editor */
    .editor-hint{font-size:12px;color:var(--ink-soft);background:var(--brand-soft);border-radius:9px;
      padding:10px 13px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
    .pop-editor{width:100%;min-height:340px;padding:18px;border-radius:12px;border:1px solid var(--line);
      font-family:var(--mono);font-size:13.5px;line-height:1.7;color:var(--ink);background:var(--panel);
      resize:vertical}
    .pop-editor:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}

    /* timeline de versões */
    .ver-timeline{position:relative;padding-left:26px}
    .ver-timeline::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:var(--line)}
    .ver-item{position:relative;margin-bottom:16px}
    .ver-dot{position:absolute;left:-26px;top:5px;width:14px;height:14px;border-radius:99px;
      background:var(--panel);border:2px solid var(--line)}
    .ver-dot.atual{background:var(--brand);border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
    .ver-body{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px 16px}
    .ver-head{display:flex;align-items:center;gap:10px;margin-bottom:5px;flex-wrap:wrap}
    .ver-num{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--brand)}
    .ver-data{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink-soft)}
    .ver-nota{font-size:14px;margin-bottom:5px}
    .ver-autor{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft)}

    /* Novo POP — cartões de opção */
    .opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:26px}
    .opt-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;text-align:left;
      cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s}
    .opt-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(27,20,48,.09);border-color:var(--brand)}
    .opt-card .oi{width:48px;height:48px;border-radius:13px;background:var(--brand-soft);color:var(--brand);
      display:grid;place-items:center;margin-bottom:14px}
    .opt-card h3{font-size:16px;font-weight:700;margin-bottom:6px}
    .opt-card p{font-size:13px;color:var(--ink-soft);line-height:1.5}
    .opt-card.soon{opacity:.55}
    .opt-card.soon:hover{transform:none;box-shadow:none;border-color:var(--line);cursor:default}
    .model-row{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);
      border-radius:11px;padding:13px 15px;margin-bottom:9px}
    .model-row .mi{width:36px;height:36px;border-radius:9px;background:var(--brand-soft);color:var(--brand);
      display:grid;place-items:center;flex-shrink:0}
    .model-row .mn{flex:1;font-size:14px;font-weight:600}
    .model-base{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;
      color:var(--brand);margin-top:5px;font-weight:400;line-height:1.4}
    .model-base svg{flex-shrink:0}
    .uf-banner{display:flex;align-items:flex-start;gap:9px;border-radius:10px;padding:12px 15px;
      font-size:13px;line-height:1.5;margin-bottom:16px}
    .uf-banner.ok{background:var(--brand-soft);color:var(--brand-deep)}
    .uf-banner.soon{background:var(--amber-soft);color:var(--amber-deep)}
    .uf-banner svg{flex-shrink:0;margin-top:1px}
    .model-sec{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;
      color:var(--ink);text-transform:uppercase;letter-spacing:.04em;font-weight:600;
      margin:22px 0 12px}
    .model-sec svg{color:var(--brand)}

    /* distribuir */
    .dist-grid{display:grid;grid-template-columns:1fr 280px;gap:20px;align-items:start}
    .dist-grid > div{min-width:0}
    .dist-link{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
    .dist-link .box{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--panel);
      border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-family:var(--mono);
      font-size:12.5px;color:var(--ink);overflow:hidden}
    .dist-link .box span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
    .dist-steps{background:var(--brand-soft);border-radius:12px;padding:18px 20px}
    .dist-steps h3{font-size:14px;font-weight:700;color:var(--brand-deep);margin-bottom:10px}
    .dist-step{display:flex;gap:10px;margin-bottom:9px;align-items:flex-start;font-size:13px;line-height:1.5}
    .dist-step .n{font-family:var(--mono);font-weight:700;color:var(--brand);min-width:16px}
    .qr-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;text-align:center}
    .qr-box{width:180px;height:180px;margin:12px auto;background:#fff;border:1px solid var(--line);
      border-radius:10px;display:grid;place-items:center;padding:10px}
    .qr-box img,.qr-box canvas{max-width:100%;height:auto}

    /* visão colaborador (tela cheia) */
    .colab-wrap{min-height:100vh;background:var(--bg);display:flex;flex-direction:column;align-items:center;padding:0 16px}
    .colab-top{width:100%;max-width:640px;display:flex;align-items:center;gap:9px;padding:16px 0}
    .colab-top .mk{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#8B5CFF,#6C3BF5);display:grid;place-items:center}
    .colab-card{width:100%;max-width:640px;background:var(--panel);border:1px solid var(--line);
      border-radius:16px;padding:26px;margin-bottom:30px}
    .colab-doc{max-height:none}
    .colab-hint{font-family:var(--mono);font-size:11px;color:var(--ink-soft);text-align:center;margin-top:14px;line-height:1.6}
    .colab-ok{text-align:center;padding:16px 0}
    .colab-ok .circle-ok{width:64px;height:64px;border-radius:99px;background:var(--green-soft);
      display:grid;place-items:center;margin:0 auto 16px}

    @media (max-width:900px){ .dist-grid{grid-template-columns:1fr} }
    @media (max-width:600px){ .opt-grid{grid-template-columns:1fr} .pop-editor{min-height:260px;font-size:13px} }

    /* leitura */
    .stat-row{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
    .stat{flex:1;min-width:150px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:15px 17px}
    .stat .num{font-family:var(--mono);font-size:28px;font-weight:700}
    .stat .num small{font-size:15px;color:var(--ink-soft)}
    .stat .lbl{font-size:13px;color:var(--ink-soft);margin-top:2px}
    .sec-label{font-family:var(--mono);font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
    .read-list{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:22px}
    .read-item{display:flex;align-items:center;gap:12px;padding:12px 15px;border-top:1px solid var(--line)}
    .read-item:first-child{border-top:none}
    .read-item .av{width:34px;height:34px;border-radius:99px;background:var(--brand);display:grid;place-items:center;
      color:#fff;font-family:var(--mono);font-size:12px;font-weight:700;flex-shrink:0}
    .read-item .who{flex:1}
    .read-item .who .n{font-size:14px;font-weight:600}
    .read-item .who .c{font-size:12px;color:var(--ink-soft)}
    .read-item .when{text-align:right;font-family:var(--mono);font-size:12px}
    .read-item .when .v{color:var(--green);font-size:11px;margin-top:2px}
    .pend-chips{display:flex;gap:10px;flex-wrap:wrap}
    .pend-chip{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px dashed rgba(181,112,26,.4);
      border-radius:10px;padding:9px 13px}
    .pend-chip .av{width:30px;height:30px;border-radius:99px;background:var(--amber-soft);display:grid;place-items:center;
      color:var(--amber);font-family:var(--mono);font-size:11px;font-weight:700}
    .pend-chip .n{font-size:13px;font-weight:600}
    .pend-chip .c{font-size:11px;color:var(--ink-soft)}

    /* ---- Equipe ---- */
    .team-list{display:grid;gap:10px}
    .team-card{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;background:var(--panel);
      border:1px solid var(--line);border-radius:11px;padding:14px 17px}
    .team-card.inativo{opacity:.6}
    .team-card .av{width:40px;height:40px;border-radius:99px;background:var(--brand);display:grid;place-items:center;
      color:#fff;font-family:var(--mono);font-size:13px;font-weight:700;flex-shrink:0}
    .team-card .nome{font-size:15px;font-weight:600}
    .team-card .sub{font-size:12px;color:var(--ink-soft);margin-top:2px}
    .team-card .acts{display:flex;gap:6px}
    .icon-btn{background:none;border:1px solid var(--line);border-radius:8px;padding:7px;color:var(--ink-soft);
      display:grid;place-items:center}
    .role-tag{display:inline-block;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.03em;
      padding:2px 7px;border-radius:4px;font-weight:600}
    .role-rt{background:var(--brand-soft);color:var(--brand)}
    .role-editor{background:#EAF0FA;color:#3A6FB0}
    .role-leitor{background:#EEF1F0;color:var(--ink-soft)}
    .team-toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);margin-bottom:16px}

    /* modal / formulário */
    .modal-bg{position:fixed;inset:0;background:rgba(8,42,46,.45);display:flex;align-items:flex-start;
      justify-content:center;padding:24px 16px;overflow:auto;z-index:50}
    .modal{background:var(--panel);border-radius:16px;width:100%;max-width:520px;padding:26px;margin-top:20px}
    .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
    .modal-head h2{font-size:20px;font-weight:700}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .form-grid .full{grid-column:1/-1}
    .fld label{display:block;font-size:12px;font-weight:600;margin-bottom:5px}
    .fld input,.fld select{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--line);
      font-size:14px;color:var(--ink);background:var(--panel)}
    .fld input:focus,.fld select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
    .fld .hint{font-size:11px;color:var(--ink-soft);margin-top:4px}
    .req{color:var(--red)}
    .modal-actions{display:flex;gap:10px;margin-top:22px}
    .role-help{background:var(--brand-soft);border-radius:8px;padding:12px 14px;font-size:12px;
      color:var(--brand-deep);line-height:1.6;margin-top:6px}
    @media (max-width:520px){ .form-grid{grid-template-columns:1fr} }

    /* ---- responsivo ---- */
    /* Tablet e abaixo: troca sidebar por barra inferior */
    @media (max-width:900px){
      .login-brand{display:none}
      .logo-mobile{display:flex}
      .topbar .estab{display:none}
      .sidebar{display:none}
      .tabbar{display:flex}
      .body{padding-bottom:0}
      .content{padding:22px 20px;max-width:100%}
      .planos-grid{grid-template-columns:1fr !important}
    }
    /* Celular: ajustes de espaçamento e toque */
    @media (max-width:600px){
      .content{padding:18px 14px}
      .topbar{padding:12px 16px}
      .page-icon{width:40px;height:40px;border-radius:11px}
      .page-head h1{font-size:21px}
      .toolbar{gap:9px}
      .search{min-width:0;flex:1 1 100%}
      .toolbar .btn-primary{flex:1 1 100%;justify-content:center}
      .pop-card{padding:13px 14px;gap:11px}
      .pop-ico{width:38px;height:38px}
      .pop-card .nome{font-size:14.5px}
      .team-card{grid-template-columns:auto 1fr;gap:12px}
      .team-card .acts{grid-column:2;justify-self:end;margin-top:4px}
      .modal{padding:20px;border-radius:14px;margin-top:8px}
      .modal-bg{padding:12px 10px}
      .stat-row{gap:9px}
      .stat{min-width:0;flex:1 1 calc(50% - 5px);padding:13px 14px}
      .stat .num{font-size:24px}
      .doc-card{padding:18px}
      .doc-actions{gap:8px}
      .doc-actions .btn{flex:1 1 100%;justify-content:center}
    }
    /* Telas muito estreitas: nada pode vazar */
    @media (max-width:380px){
      .page-head-row{gap:10px}
      .page-icon{width:36px;height:36px}
      .page-head h1{font-size:19px}
      .team-card .nome{font-size:14px}
      .tab .lbl{font-size:9px}
      .btn,.btn-primary{font-size:13px;padding:11px 12px}
    }

        /* ============================================================
       DESIGN SYSTEM "Fintech Clean" — v3 (Nubank-inspired)
       Branco puro, roxo Nubank concentrado, ícones em círculo
       pastel, cantos generosos, sombras suaves. Só Inter.
    ============================================================ */
    h1,h2,h3{font-family:var(--sans);font-weight:700;letter-spacing:-.02em;line-height:1.2;color:var(--ink)}

    /* — Botões — */
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
      font-family:var(--sans);font-weight:600;font-size:15px;line-height:1;border-radius:var(--r-pill);
      padding:0 20px;min-height:48px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);
      transition:background .16s,border-color .16s,transform .1s,box-shadow .16s;white-space:nowrap;letter-spacing:-.01em}
    .btn:hover{background:var(--panel-2);border-color:var(--line)}
    .btn:active{transform:scale(.98)}
    .btn:focus-visible{outline:none;box-shadow:var(--ring)}
    .btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
    .btn-primary:hover{background:var(--brand-hover);border-color:var(--brand-hover)}
    .btn-block{width:100%}
    .btn svg{width:17px;height:17px;flex-shrink:0}
    .btn-sm{min-height:40px;padding:0 16px;font-size:14px}

    /* — Header — */
    .topbar{display:flex;align-items:center;gap:var(--s3);padding:0 var(--s5);height:64px;
      background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
    .brand-logo,.logo-mobile{display:flex;align-items:center;gap:10px}
    .brand-logo .mk,.logo-mobile .mk,.topbar .mk{width:36px;height:36px;border-radius:11px;
      background:var(--brand);display:grid;place-items:center;flex-shrink:0}
    .topbar .name{font-family:var(--sans)!important;color:var(--ink)!important;font-size:18px;font-weight:700;letter-spacing:-.03em}
    .topbar .name span{color:var(--brand)}
    .topbar .estab{margin-left:auto;text-align:right;font-size:12px;color:var(--ink-soft);line-height:1.4}
    .topbar .estab b{color:var(--ink);font-weight:600}
    .icon-btn,.btn-logout{display:inline-flex;align-items:center;justify-content:center;gap:6px;
      min-height:44px;min-width:44px;padding:0 14px;border-radius:var(--r-pill);border:1.5px solid var(--line);
      background:var(--panel);color:var(--ink-soft);font-size:14px;font-weight:600;cursor:pointer;
      transition:background .16s,border-color .16s,color .16s}
    .icon-btn:hover,.btn-logout:hover{background:var(--panel-2);color:var(--ink)}
    .btn-logout:focus-visible,.icon-btn:focus-visible{outline:none;box-shadow:var(--ring)}

    /* — Sidebar — */
    .sidebar{width:236px;background:var(--panel);border-right:1px solid var(--line);
      padding:var(--s4) var(--s3);display:flex;flex-direction:column;gap:3px}
    .nav-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r2);
      color:var(--ink-soft);font-weight:600;font-size:14.5px;cursor:pointer;border:none;background:none;
      width:100%;text-align:left;transition:background .16s,color .16s}
    .nav-item:hover{background:var(--panel-2);color:var(--ink)}
    .nav-item.active{background:var(--brand-tint);color:var(--brand)}
    .nav-item svg{width:20px;height:20px;flex-shrink:0}
    .nav-badge{margin-left:auto;background:var(--amber);color:#fff;font-size:11px;font-weight:700;
      min-width:20px;height:20px;border-radius:var(--r-pill);display:grid;place-items:center;padding:0 6px}
    .sidebar .perfil{margin-top:auto;display:flex;align-items:center;gap:11px;padding:12px 14px}
    .sidebar .perfil .av{width:38px;height:38px;border-radius:var(--r-pill);background:var(--c-roxo);
      color:var(--c-roxo-ink);display:grid;place-items:center;font-size:13px;font-weight:700}
    .sidebar .perfil .n{font-size:13.5px;font-weight:600;color:var(--ink)}
    .sidebar .perfil .r{font-size:11.5px;color:var(--ink-faint)}

    /* — Conteúdo — */
    .content{padding:var(--s6) var(--s6);max-width:920px;margin:0 auto;width:100%}

    /* — Cabeçalho de página — */
    .page-head{margin-bottom:var(--s5)}
    .page-head-row{display:flex;align-items:center;gap:var(--s3)}
    .page-icon{width:48px;height:48px;border-radius:var(--r-pill);background:var(--c-roxo);
      display:grid;place-items:center;color:var(--c-roxo-ink);flex-shrink:0}
    .page-icon svg{width:22px;height:22px}
    .page-icon.amber{background:var(--c-ambar);color:var(--c-ambar-ink)}
    .page-head h1{font-size:26px;margin:0;font-weight:700;letter-spacing:-.03em}
    .page-head .eyebrow{font-size:12px;color:var(--ink-faint);font-weight:600;margin-bottom:3px}
    .page-head p{font-size:14px;color:var(--ink-soft);margin-top:3px}

    /* — Toolbar / busca — */
    .toolbar{display:flex;gap:var(--s3);margin-bottom:var(--s5);flex-wrap:wrap}
    .search{position:relative;flex:1;min-width:200px}
    .search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--ink-faint);width:18px;height:18px}
    .search input{width:100%;height:50px;padding:0 16px 0 46px;border-radius:var(--r-pill);border:1.5px solid var(--line);
      font-size:15px;font-family:var(--sans);color:var(--ink);background:var(--panel-2);transition:border-color .16s,box-shadow .16s,background .16s}
    .search input::placeholder{color:var(--ink-faint)}
    .search input:focus{outline:none;border-color:var(--brand);background:var(--panel);box-shadow:var(--ring)}

    /* — Cards de lista (flat, círculo pastel, sem borda lateral) — */
    .pop-list{display:flex;flex-direction:column;gap:var(--s3)}
    .pop-card{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:var(--s4);
      background:var(--panel);border:1px solid var(--line);border-radius:var(--r3);
      padding:16px 18px;text-align:left;width:100%;cursor:pointer;
      transition:box-shadow .16s,transform .1s,border-color .16s;box-shadow:var(--sh1);position:relative}
    .pop-card:hover{box-shadow:var(--sh2);transform:translateY(-2px);border-color:var(--line)}
    .pop-card:focus-visible{outline:none;box-shadow:var(--ring)}
    .pop-ico{width:46px;height:46px;border-radius:var(--r-pill);background:var(--c-roxo);display:grid;
      place-items:center;color:var(--c-roxo-ink);flex-shrink:0}
    .pop-ico svg{width:22px;height:22px}
    .pop-card.cat-dispensacao .pop-ico,.pop-card.cat-controlados .pop-ico{background:var(--c-roxo);color:var(--c-roxo-ink)}
    .pop-card.cat-armazenamento .pop-ico{background:var(--c-azul);color:var(--c-azul-ink)}
    .pop-card.cat-logistica .pop-ico{background:var(--c-ambar);color:var(--c-ambar-ink)}
    .pop-card.cat-limpeza .pop-ico{background:var(--c-verde);color:var(--c-verde-ink)}
    .pop-card.cat-residuos .pop-ico{background:var(--c-rosa);color:var(--c-rosa-ink)}
    .pop-card.cat-atendimento .pop-ico{background:var(--c-azul);color:var(--c-azul-ink)}
    .pop-card .meta-top{display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap}
    .pop-card .pid{font-size:11.5px;color:var(--ink-faint);font-weight:600}
    .pop-card .nome{font-size:15.5px;font-weight:700;line-height:1.3;color:var(--ink);letter-spacing:-.02em}
    .pop-card .meta-bot{display:flex;align-items:center;gap:8px;margin-top:5px;flex-wrap:wrap}
    .pop-card .sub{font-size:12.5px;color:var(--ink-soft)}
    .pop-card .leram{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--ink-faint);font-weight:500}
    .pop-card .leram svg{width:13px;height:13px}
    .pop-card .leram.full{color:var(--green)}
    .chev{color:var(--ink-faint);flex-shrink:0}
    .chev svg{width:20px;height:20px}
    .pop-card:hover .chev{color:var(--brand)}

    /* — Badges (pills arredondadas) — */
    .badge-pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;
      padding:4px 10px;border-radius:var(--r-pill);font-weight:600;letter-spacing:0;text-transform:none}
    .badge-pill svg{width:11px;height:11px}
    .b-vigente{background:var(--green-soft);color:var(--green)}
    .b-revisar{background:var(--amber-soft);color:var(--amber-deep)}
    .b-rascunho{background:var(--panel-3);color:var(--ink-soft)}
    .b-aprovacao{background:var(--blue-soft);color:var(--blue)}
    .b-alto{background:var(--red-soft);color:var(--red)}
    .b-medio{background:var(--amber-soft);color:var(--amber-deep)}

    /* — Card de equipe — */
    .team-card{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:var(--s4);
      background:var(--panel);border:1px solid var(--line);border-radius:var(--r3);
      padding:16px 18px;box-shadow:var(--sh1);transition:box-shadow .16s}
    .team-card:hover{box-shadow:var(--sh2)}
    .team-card .av{width:48px;height:48px;border-radius:var(--r-pill);display:grid;place-items:center;
      font-weight:700;font-size:15px;flex-shrink:0;background:var(--c-roxo);color:var(--c-roxo-ink)}
    .team-card.papel-rt .av{background:var(--c-roxo);color:var(--c-roxo-ink)}
    .team-card.papel-editor .av{background:var(--c-azul);color:var(--c-azul-ink)}
    .team-card.papel-leitor .av{background:var(--c-cinza);color:var(--c-cinza-ink)}
    .team-card.inativo{opacity:.55}
    .team-card .nome{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap;letter-spacing:-.02em}
    .team-card .sub{font-size:13px;color:var(--ink-soft);margin-top:3px;line-height:1.5}
    .team-card .acts{display:flex;gap:8px}

    /* — Etiquetas de papel — */
    .role-tag{display:inline-flex;align-items:center;font-size:10.5px;font-weight:700;padding:3px 9px;
      border-radius:var(--r-pill);letter-spacing:.02em;text-transform:uppercase}
    .role-rt{background:var(--brand-soft);color:var(--brand)}
    .role-editor{background:var(--blue-soft);color:var(--blue)}
    .role-leitor{background:var(--panel-3);color:var(--ink-soft)}

    /* — Estatísticas — */
    .stat-row{display:flex;gap:var(--s3);margin-bottom:var(--s5)}
    .stat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:var(--r3);padding:18px 20px;box-shadow:var(--sh1)}
    .stat .num{font-size:30px;font-weight:800;line-height:1;letter-spacing:-.03em}
    .stat .num small{font-size:16px;color:var(--ink-faint);font-weight:600}
    .stat .lbl{font-size:12.5px;color:var(--ink-soft);margin-top:6px;font-weight:500}

    /* — Documento — */
    .doc-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r4);padding:28px}
    .doc-sec{font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.04em;
      color:var(--brand);margin:22px 0 8px}
    .doc-sec:first-child{margin-top:0}
    .doc-card p{font-size:15px;line-height:1.7;margin-bottom:13px;color:#3A3547}
    .doc-actions{display:flex;gap:var(--s3);margin-top:var(--s5);flex-wrap:wrap}

    /* — Abas (pills) — */
    .tabs{display:flex;gap:6px;margin-bottom:var(--s5);background:var(--panel-2);padding:5px;border-radius:var(--r-pill);width:fit-content;max-width:100%;overflow-x:auto}
    .tab-btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border:none;background:none;
      font-family:var(--sans);font-size:13.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;
      border-radius:var(--r-pill);transition:background .16s,color .16s;white-space:nowrap}
    .tab-btn svg{width:15px;height:15px}
    .tab-btn:hover{color:var(--ink)}
    .tab-btn.active{background:var(--panel);color:var(--brand);box-shadow:var(--sh1)}

    /* — Faixa de leitura — */
    .faixa{display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:var(--r3);
      font-size:13.5px;margin-bottom:var(--s5);line-height:1.4}
    .faixa svg{flex-shrink:0;width:18px;height:18px}
    .faixa .txt{flex:1;font-weight:500}
    .faixa.ok{background:var(--green-soft);color:#0C7A3D}
    .faixa.pend{background:var(--amber-soft);color:var(--amber-deep)}
    .btn-amber{background:var(--amber);color:#fff;border:none;border-radius:var(--r-pill);padding:9px 16px;
      font-size:13px;font-weight:600;cursor:pointer;font-family:var(--sans);white-space:nowrap;transition:background .16s}
    .btn-amber:hover{background:var(--amber-deep)}

    /* — Editor — */
    .editor-hint{font-size:12.5px;color:var(--ink-soft);background:var(--brand-tint);
      border-radius:var(--r2);padding:12px 15px;margin-bottom:14px;display:flex;align-items:center;gap:9px}
    .editor-hint svg{width:16px;height:16px;flex-shrink:0;color:var(--brand)}
    .pop-editor{width:100%;min-height:340px;padding:18px;border-radius:var(--r3);border:1.5px solid var(--line);
      font-family:var(--sans);font-size:14.5px;line-height:1.7;color:var(--ink);background:var(--panel-2);resize:vertical}
    .pop-editor:focus{outline:none;border-color:var(--brand);box-shadow:var(--ring);background:var(--panel)}

    /* — Timeline — */
    .ver-timeline{position:relative;padding-left:26px}
    .ver-timeline::before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:var(--line)}
    .ver-item{position:relative;margin-bottom:14px}
    .ver-dot{position:absolute;left:-26px;top:6px;width:14px;height:14px;border-radius:var(--r-pill);background:var(--panel);border:2px solid var(--line)}
    .ver-dot.atual{background:var(--brand);border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-tint)}
    .ver-body{background:var(--panel);border:1px solid var(--line);border-radius:var(--r3);padding:14px 17px;box-shadow:var(--sh1)}
    .ver-head{display:flex;align-items:center;gap:9px;margin-bottom:5px;flex-wrap:wrap}
    .ver-num{font-size:13.5px;font-weight:700;color:var(--brand)}
    .ver-data{margin-left:auto;font-size:11.5px;color:var(--ink-faint);font-weight:500}
    .ver-nota{font-size:14px;margin-bottom:5px;color:var(--ink)}
    .ver-autor{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft)}

        conteudo:"## 1. Objetivo\nEstabelecer a rotina de limpeza e sanitização dos ambientes, mobiliários e equipamentos, mantendo as condições higiênico-sanitárias exigidas pela Resolução SESA-PR nº 590/2014 (Art. 98, I).\n\n## 2. Responsabilidades\nO responsável técnico aprova este procedimento e supervisiona sua execução. Os funcionários designados executam a limpeza e registram sua realização.\n\n## 3. Materiais e produtos\nUtilizar produtos saneantes regularizados pela ANVISA para a finalidade a que se destinam (Art. 25, X). Os materiais de limpeza e germicidas devem ser armazenados em local identificado e específico (Art. 26).\n\n## 4. Procedimento\nHigienizar pisos, paredes, tetos e mobiliários, que devem ter superfícies lisas, impermeáveis e laváveis (Art. 25, II e VI). Realizar a limpeza no início e no fim do expediente e sempre que necessário. As superfícies devem permanecer resistentes aos agentes sanitizantes.\n\n## 5. Registros\nRegistrar a execução da limpeza. Os registros devem ser mantidos no estabelecimento por, no mínimo, 5 anos, à disposição da Vigilância Sanitária (Art. 101)." },
      { id:"mod-2", nome:"Aquisição, Recebimento, Armazenamento e Dispensação de Medicamentos", categoria:"Logística", uf:"PR", base:"SESA-PR 590/2014, Art. 98, II; Art. 30; Art. 31; Art. 33",
        conteudo:"## 1. Objetivo\nPadronizar a aquisição, o recebimento, o armazenamento, a organização e a dispensação de medicamentos e produtos, conforme a Resolução SESA-PR nº 590/2014 (Art. 98, II).\n\n## 2. Recebimento (Art. 30)\nVerificar se o fornecedor possui Licença Sanitária atualizada. Conferir as notas fiscais com o número de lote quando aplicável. Verificar registro/notificação na ANVISA, número de lote, data de validade e integridade de embalagens, rótulos e bulas. Conferir se as condições de transporte preservaram o produto.\n\n## 3. Armazenamento (Art. 31)\nManter prateleiras e estrados de material liso, lavável e impermeável, em boas condições de higiene. Armazenar ao abrigo da luz solar direta, na temperatura e umidade especificadas pelo fabricante, respeitando distância mínima das paredes. É vedado dispensar produtos vencidos. Produtos vencidos, violados ou com suspeita de irregularidade devem ser segregados em local próprio e identificado, fora da área de dispensação.\n\n## 4. Dispensação (Art. 33)\nMedicamentos devem permanecer em área de circulação restrita aos funcionários, sem exposição direta ao público. É vedada a dispensação de tarjados ou sob controle especial sem prescrição de profissional habilitado. Orientar o usuário quanto à posologia, interações e conservação.\n\n## 5. Registros\nManter a documentação por no mínimo 5 anos (Art. 101)." },
      { id:"mod-3", nome:"Guarda e Controle de Medicamentos Termolábeis (MCEA)", categoria:"Armazenamento", uf:"PR", base:"SESA-PR 590/2014, Art. 40; Art. 41; Art. 42; Art. 45",
        conteudo:"## 1. Objetivo\nGarantir a manutenção da cadeia de frio de medicamentos termolábeis e MCEA, conforme a Resolução SESA-PR nº 590/2014 (Art. 40 a 46).\n\n## 2. Equipamento (Art. 40)\nUtilizar geladeira apropriada com baixa variação de temperatura, mantendo entre 2°C e 8°C. É vedado o uso de geladeira tipo duplex, frost-free ou frigobar. Recomenda-se geladeira doméstica a partir de 280 litros. Observar o sistema PVPS (primeiro a vencer, primeiro a sair).\n\n## 3. Organização da geladeira (Art. 41)\nO sensor do termômetro digital de máxima e mínima deve ficar suspenso no centro da segunda prateleira. Preencher a gaveta de legumes com garrafas de água identificadas como impróprias para consumo, para estabilizar a temperatura. Não armazenar nada na porta.\n\n## 4. Controle diário (Art. 42)\nFazer a leitura da temperatura no mínimo duas vezes ao dia (início e fim da jornada), por termômetro digital de máxima e mínima, anotando os valores no formulário de controle diário de temperatura. É vedada a guarda de alimentos e bebidas na geladeira. Fazer degelo a cada 15 dias ou quando a camada de gelo superar 0,5 cm. Usar tomada exclusiva.\n\n## 5. Recebimento (Art. 45)\nVerificar, com termômetro digital, se os MCEA chegaram entre 2°C e 8°C. Não aceitar medicamentos fora das especificações e denunciar o fato à Vigilância Sanitária. Colocar de imediato em geladeira.\n\n## 6. Registros\nManter os registros de temperatura por no mínimo 5 anos (Art. 101)." },
      { id:"mod-4", nome:"Destino de Produtos com Prazo de Validade Vencido", categoria:"Resíduos", uf:"PR", base:"SESA-PR 590/2014, Art. 98, III; Art. 31, VII-IX; Art. 101",
        conteudo:"## 1. Objetivo\nDefinir o procedimento de segregação e descarte de produtos e medicamentos com prazo de validade vencido, conforme a Resolução SESA-PR nº 590/2014 (Art. 98, III).\n\n## 2. Segregação (Art. 31, VII)\nProdutos vencidos, violados ou com suspeita de falsificação, corrupção, adulteração ou alteração devem ser segregados em ambiente seguro e diverso da área de dispensação, identificados quanto à sua condição e destino, de modo a evitar sua entrega ao consumo.\n\n## 3. Descarte (Art. 31, IX)\nA inutilização e o descarte devem obedecer às exigências da legislação específica para Gerenciamento de Resíduos de Serviços de Saúde (PGRSS), assim como às normas estadual e municipais complementares.\n\n## 4. Controlados\nMedicamentos sujeitos a controle especial devem ser descartados conforme a Portaria nº 344/1998 e o PGRSS.\n\n## 5. Registros\nRegistrar as quantidades e o encaminhamento. Manter a documentação por no mínimo 5 anos (Art. 101)." },
      { id:"mod-5", nome:"Destinação de Produtos Próximos ao Vencimento", categoria:"Resíduos", uf:"PR", base:"SESA-PR 590/2014, Art. 98, IV; Art. 31, XI; Art. 34, §1º-§2º",
        conteudo:"## 1. Objetivo\nEstabelecer o procedimento para os produtos com prazo de validade próximo ao vencimento, conforme a Resolução SESA-PR nº 590/2014 (Art. 98, IV).\n\n## 2. Procedimento (Art. 31, XI)\nA empresa deve determinar procedimentos para os produtos com validade próxima ao vencimento, inclusive insumos. Monitorar periodicamente os prazos e priorizar a saída pelo sistema PVPS.\n\n## 3. Dispensação (Art. 34)\nO usuário deve ser alertado quando for dispensado produto com prazo de validade próximo ao vencimento (§1º). É vedado dispensar medicamentos cuja posologia não possa ser concluída dentro do prazo de validade vigente (§2º).\n\n## 4. Registros\nManter registros do monitoramento por no mínimo 5 anos (Art. 101)." },
      { id:"mod-6", nome:"Utilização e Descarte de Materiais Descartáveis e Perfurocortantes", categoria:"Resíduos", uf:"PR", base:"SESA-PR 590/2014, Art. 98, VI; Art. 76; Art. 90",
        conteudo:"## 1. Objetivo\nEstabelecer o uso e a destinação de materiais descartáveis e perfurocortantes utilizados nos serviços farmacêuticos, conforme a Resolução SESA-PR nº 590/2014 (Art. 98, VI).\n\n## 2. Perfurocortantes\nUtilizar coletor rígido para perfurocortantes, instalado de forma a preservar sua integridade. Descartar seguindo as exigências da legislação de Gerenciamento de Resíduos de Serviços de Saúde (Art. 76).\n\n## 3. Resíduos de serviços de saúde\nMateriais como gaze ou algodão sujos com sangue devem ser descartados conforme legislação específica (Art. 76). O POP deve conter instruções sobre uso e descarte dos materiais (Art. 90).\n\n## 4. Registros\nManter os registros por no mínimo 5 anos (Art. 101)." },
      { id:"mod-7", nome:"Dispensação e Guarda de Medicamentos Sujeitos a Controle Especial", categoria:"Controlados", uf:"PR", base:"SESA-PR 590/2014, Art. 36; Portaria SVS/MS 344/1998",
        conteudo:"## 1. Objetivo\nPadronizar a dispensação e a guarda de medicamentos e substâncias sujeitos a controle especial, conforme a Resolução SESA-PR nº 590/2014 (Art. 36) e a Portaria nº 344/1998.\n\n## 2. Guarda\nManter os medicamentos sob controle especial em sala fechada ou armário com chave, em área de circulação restrita (Art. 4º, XII, a).\n\n## 3. Dispensação (Art. 36, § único)\nNo momento da dispensação, realizar inspeção visual para verificar, no mínimo, a identificação do medicamento, o prazo de validade e a integridade da embalagem. É vedada a dispensação sem a devida prescrição de profissional habilitado (Art. 33, I). É vedada a dispensação de controlados solicitados por meio remoto (Art. 51, §2º).\n\n## 4. Escrituração\nTransmitir os dados de movimentação conforme a Portaria nº 344/1998 e o SNGPC (RDC nº 20/2011).\n\n## 5. Registros\nManter a documentação por no mínimo 5 anos (Art. 101)." },
      { id:"mod-8", nome:"Verificação e Calibração de Equipamentos e Instrumentos", categoria:"Atendimento", uf:"PR", base:"SESA-PR 590/2014, Art. 92; Art. 94; Art. 95",
        conteudo:"## 1. Objetivo\nEstabelecer a verificação diária, a calibração e a manutenção de equipamentos, instrumentos e aparelhos, conforme a Resolução SESA-PR nº 590/2014 (Art. 92 a 95).\n\n## 2. Verificação diária (Art. 94)\nA verificação/checagem diária deve ser feita por pessoal treinado e autorizado, antes do início das atividades, empregando procedimentos escritos aprovados pelo responsável técnico, mantendo-se os registros. Manter lista dos equipamentos que exigem verificação diária.\n\n## 3. Calibração (Art. 92)\nOs instrumentos de medição devem ser calibrados no mínimo uma vez ao ano, por laboratórios acreditados pelo INMETRO/CGCRE. Manter os certificados de calibração.\n\n## 4. Manutenção (Art. 95)\nInstituir Programa de Manutenção Periódica e Corretiva segundo instruções do fabricante, mantendo os registros.\n\n## 5. Registros\nManter os registros de manutenção e calibração por no mínimo 5 anos (Art. 101)." },
      // Modelos genéricos — disponíveis em qualquer estado (uf:null), servem de ponto de partida
      // enquanto não há curadoria específica do estado. São mais simples que os fundamentados.
      { id:"mod-g1", nome:"Dispensação de Medicamentos Controlados", categoria:"Dispensação", uf:null, base:"Modelo genérico — adapte à norma do seu estado",
        conteudo:"## 1. Objetivo\nEstabelecer o procedimento para dispensação de medicamentos sob controle especial.\n\n## 2. Responsabilidades\nDefinir os responsáveis pela conferência da receita e escrituração.\n\n## 3. Procedimento\nDescrever o passo a passo da dispensação: conferência da receita, verificação de validade e integridade, registro e retenção conforme exigência." },
      { id:"mod-g2", nome:"Escrituração no SNGPC", categoria:"Controlados", uf:null, base:"Modelo genérico — adapte à norma do seu estado",
        conteudo:"## 1. Objetivo\nPadronizar a escrituração de medicamentos controlados e antimicrobianos no SNGPC.\n\n## 2. Procedimento\nDescrever os lançamentos, a periodicidade de transmissão e a conferência dos balanços." },
      { id:"mod-g3", nome:"Recebimento e Conferência de Mercadorias", categoria:"Logística", uf:null, base:"Modelo genérico — adapte à norma do seu estado",
        conteudo:"## 1. Objetivo\nPadronizar o recebimento de mercadorias, assegurando integridade, validade e procedência.\n\n## 2. Procedimento\nConferir nota fiscal, embalagens, lotes e prazos de validade; registrar divergências; armazenar conforme as condições exigidas." },
      { id:"mod-g4", nome:"Controle de Temperatura de Termolábeis", categoria:"Armazenamento", uf:null, base:"Modelo genérico — adapte à norma do seu estado",
        conteudo:"## 1. Objetivo\nGarantir a manutenção da cadeia de frio de medicamentos termolábeis.\n\n## 2. Procedimento\nMonitorar a temperatura do refrigerador ao menos duas vezes ao dia, registrar em planilha e acionar o responsável em caso de desvio." },
      { id:"mod-g5", nome:"Higienização de Superfícies", categoria:"Limpeza", uf:null, base:"Modelo genérico — adapte à norma do seu estado",
        conteudo:"## 1. Objetivo\nEstabelecer a rotina de higienização de superfícies e bancadas do estabelecimento.\n\n## 2. Procedimento\nLimpar as superfícies no início e no fim do expediente com produto adequado, registrando a execução." },
      { id:"mod-g6", nome:"Descarte de Medicamentos Vencidos", categoria:"Resíduos", uf:null, base:"Modelo genérico — adapte à norma do seu estado",
        conteudo:"## 1. Objetivo\nDefinir a segregação e o descarte de medicamentos vencidos conforme o PGRSS.\n\n## 2. Procedimento\nSeparar os medicamentos vencidos, registrar quantidades e encaminhar para empresa licenciada de coleta." },
    ],
    leituras: [
      { pop_id:"POP-001", versao_numero:4, colaborador_id:"colab-1", leitor_nome:"Marcos Lima", leitor_cargo:"Farmacêutico", confirmado_em:"2026-07-22T09:14:00Z" },
      { pop_id:"POP-001", versao_numero:4, colaborador_id:"colab-2", leitor_nome:"Beatriz Nunes", leitor_cargo:"Balconista", confirmado_em:"2026-07-22T08:47:00Z" },
      { pop_id:"POP-001", versao_numero:4, colaborador_id:"colab-3", leitor_nome:"Rafael Souza", leitor_cargo:"Balconista", confirmado_em:"2026-07-21T17:32:00Z" },
      { pop_id:"POP-001", versao_numero:4, colaborador_id:"colab-4", leitor_nome:"Carla Mendes", leitor_cargo:"Auxiliar", confirmado_em:"2026-07-21T14:05:00Z" },
      { pop_id:"POP-001", versao_numero:4, colaborador_id:"colab-5", leitor_nome:"João Pereira", leitor_cargo:"Balconista", confirmado_em:"2026-07-20T10:58:00Z" },
    ],
    alertas: [
      { norma:"RDC nº 430/2020", tema:"Boas práticas de distribuição e armazenagem", segmento:"farmacia", grau:"alto", pop_afetado_id:"POP-003", publicado_em:"2026-07-18" },
      { norma:"Portaria SVS/MS 344/98", tema:"Substâncias sob controle especial", segmento:"farmacia", grau:"medio", pop_afetado_id:"POP-001", publicado_em:"2026-07-10" },
    ],
  };

  const totalEquipe = (estabId) =>
    MOCK.colaboradores.filter(c => c.estabelecimento_id === estabId && c.ativo).length;

  // Estados brasileiros. `coberto` indica se já há base regulatória curada.
  // Hoje só o Paraná (SESA-PR 590/2014). Os demais entram conforme a curadoria avança.
  const UFS = [
    { uf:"AC", nome:"Acre" }, { uf:"AL", nome:"Alagoas" }, { uf:"AP", nome:"Amapá" },
    { uf:"AM", nome:"Amazonas" }, { uf:"BA", nome:"Bahia" }, { uf:"CE", nome:"Ceará" },
    { uf:"DF", nome:"Distrito Federal" }, { uf:"ES", nome:"Espírito Santo" }, { uf:"GO", nome:"Goiás" },
    { uf:"MA", nome:"Maranhão" }, { uf:"MT", nome:"Mato Grosso" }, { uf:"MS", nome:"Mato Grosso do Sul" },
    { uf:"MG", nome:"Minas Gerais" }, { uf:"PA", nome:"Pará" }, { uf:"PB", nome:"Paraíba" },
    { uf:"PR", nome:"Paraná", coberto:true }, { uf:"PE", nome:"Pernambuco" }, { uf:"PI", nome:"Piauí" },
    { uf:"RJ", nome:"Rio de Janeiro" }, { uf:"RN", nome:"Rio Grande do Norte" }, { uf:"RS", nome:"Rio Grande do Sul" },
    { uf:"RO", nome:"Rondônia" }, { uf:"RR", nome:"Roraima" }, { uf:"SC", nome:"Santa Catarina" },
    { uf:"SP", nome:"São Paulo" }, { uf:"SE", nome:"Sergipe" }, { uf:"TO", nome:"Tocantins" },
  ];
  const ufCoberto = (uf) => UFS.some(u => u.uf === uf && u.coberto);

  // Iniciais a partir do nome (2 primeiras palavras).
  const iniciaisDe = (nome) =>
    String(nome||"").split(" ").filter(Boolean).slice(0,2).map(w => w[0]).join("").toUpperCase();

  /* ============================================================
     PERMISSÕES (papéis: responsavel_tecnico | editor | leitor)
  ============================================================ */
  const PAPEL_LABEL = {
    responsavel_tecnico: "Responsável Técnico",
    editor: "Editor",
    leitor: "Leitor",
  };
  // O que cada papel pode fazer.
  const PERMISSOES = {
    responsavel_tecnico: { criar:true, editar:true, aprovar:true, publicar:true, gerenciarEquipe:true },
    editor:              { criar:true, editar:true, aprovar:false, publicar:false, gerenciarEquipe:false },
    leitor:              { criar:false, editar:false, aprovar:false, publicar:false, gerenciarEquipe:false },
  };
  // Papel do usuário logado (o perfil é sempre RT no mock; funcionários têm papel próprio).
  function papelAtual(){ return (Auth.perfil && Auth.perfil.papel) || "responsavel_tecnico"; }
  function pode(acao){ const p = PERMISSOES[papelAtual()] || {}; return !!p[acao]; }

  /* ============================================================
     ACESSO A DADOS (mock; espelha o que virá do Supabase)
  ============================================================ */
  /* ============================================================
     STORE — espelho em memória dos dados do tenant.
     No modo mock, aponta para os arrays do MOCK.
     No modo real, é populado do Supabase por carregarDados().
     As views leem sempre do Store (síncrono). As ações
     escrevem no Supabase (async) e atualizam o Store.
  ============================================================ */
  const Store = {
    pops: [], colaboradores: [], versoes: [], leituras: [], alertas: [], modelos: [],
  };

  // Converte uma linha do banco para o formato que o app usa (datas etc.).
  function carregarDoMock(){
    Store.pops = MOCK.pops;
    Store.colaboradores = MOCK.colaboradores;
    Store.versoes = MOCK.versoes;
    Store.leituras = MOCK.leituras;
    Store.alertas = MOCK.alertas;
    Store.modelos = MOCK.modelos;
  }

  // Carrega todos os dados do tenant do Supabase para o Store.
  async function carregarDados(){
    if (MODO_MOCK){ carregarDoMock(); return; }
    const e = Auth.estabelecimento;
    if (!e){ return; }
    const eid = e.id;
    // Consultas em paralelo (RLS garante que só vêm dados do tenant).
    const [pops, colabs, versoes, leituras, alertas, modelos] = await Promise.all([
      sb.from("pops").select("*").eq("estabelecimento_id", eid),
      sb.from("colaboradores").select("*").eq("estabelecimento_id", eid),
      sb.from("versoes_pop").select("*").eq("estabelecimento_id", eid),
      sb.from("registros_leitura").select("*").eq("estabelecimento_id", eid),
      sb.from("alertas_regulatorios").select("*").eq("segmento", e.segmento || "farmacia"),
      sb.from("modelos_pop").select("*"),
    ]);
    Store.pops = (pops.data || []).map(mapPop);
    Store.colaboradores = (colabs.data || []).map(mapColab);
    Store.versoes = (versoes.data || []).map(mapVersao);
    Store.leituras = (leituras.data || []).map(mapLeitura);
    Store.alertas = (alertas.data || []).map(mapAlerta);
    Store.modelos = (modelos.data || []).map(mapModelo);
  }

  // Mapeadores banco → app (nomes de campo iguais; ajustam datas curtas).
  const mapPop = (r) => ({ id:r.id, estabelecimento_id:r.estabelecimento_id, nome:r.nome,
    categoria:r.categoria, status:r.status, origem:r.origem, versao_atual:r.versao_atual,
    leitura_obrigatoria:r.leitura_obrigatoria, conteudo:r.conteudo||"",
    atualizado_em:(r.atualizado_em||"").slice(0,10) });
  const mapColab = (r) => ({ id:r.id, estabelecimento_id:r.estabelecimento_id, nome:r.nome,
    cpf:r.cpf, cargo:r.cargo, papel:r.papel, crf:r.crf, email:r.email, telefone:r.telefone,
    admissao:(r.admissao||"").slice(0,10), ativo:r.ativo });
  const mapVersao = (r) => ({ pop_id:r.pop_id, numero:r.numero, autor_nome:r.autor_nome,
    nota:r.nota, vigente:r.vigente, criado_em:r.criado_em });
  const mapLeitura = (r) => ({ pop_id:r.pop_id, versao_numero:r.versao_numero,
    colaborador_id:r.colaborador_id, leitor_nome:r.leitor_nome, leitor_cpf:r.leitor_cpf,
    leitor_cargo:r.leitor_cargo, confirmado_em:r.confirmado_em });
  const mapAlerta = (r) => ({ norma:r.norma, tema:r.tema, descricao:r.descricao, segmento:r.segmento,
    grau:r.grau, pop_afetado_id:r.pop_afetado_id, fonte_url:r.fonte_url, publicado_em:(r.publicado_em||"").slice(0,10) });
  const mapModelo = (r) => ({ id:r.id, nome:r.nome, categoria:r.categoria, uf:r.uf, base:r.base, conteudo:r.conteudo });

  /* ============================================================
     DB — leitura sempre do Store (síncrono).
     Escrita: no mock altera o Store; no real persiste no
     Supabase (funções async terminadas em "Async") e o
     chamador atualiza o Store + re-renderiza.
  ============================================================ */
  const DB = {
    listarPops(estabId){
      const equipe = totalEquipe(estabId);
      return Store.pops
        .filter(p => p.estabelecimento_id === estabId)
        .map(p => {
          const leram = p.status === "rascunho" ? 0 :
            Store.leituras.filter(l => l.pop_id === p.id && l.versao_numero === p.versao_atual).length;
          const alerta = Store.alertas.some(a => a.pop_afetado_id === p.id) || p.status === "revisar";
          return Object.assign({}, p, { leram, equipe, alerta });
        })
        .sort((a,b) => a.id.localeCompare(b.id));
    },
    getPop(popId){ return Store.pops.find(p => p.id === popId) || null; },
    getVersoes(popId){
      return Store.versoes.filter(v => v.pop_id === popId).slice().sort((a,b) => b.numero - a.numero);
    },
    listarModelos(uf){ return Store.modelos.filter(m => !m.uf || m.uf === uf); },
    modelosDoEstado(uf){ return Store.modelos.filter(m => m.uf === uf); },
    modelosGenericos(){ return Store.modelos.filter(m => !m.uf); },
    getLeituras(popId, versao){
      return Store.leituras
        .filter(l => l.pop_id === popId && l.versao_numero === versao)
        .slice().sort((a,b) => b.confirmado_em.localeCompare(a.confirmado_em));
    },
    getPendentes(popId, versao, estabId){
      const leram = new Set(
        Store.leituras.filter(l => l.pop_id === popId && l.versao_numero === versao).map(l => l.colaborador_id)
      );
      return Store.colaboradores.filter(c => c.estabelecimento_id === estabId && c.ativo && !leram.has(c.id));
    },
    jaLeu(popId, versao, colaboradorId){
      return Store.leituras.some(l =>
        l.pop_id === popId && l.versao_numero === versao && l.colaborador_id === colaboradorId);
    },
    buscarColaboradorPorCpf(estabId, cpf){
      const limpo = String(cpf).replace(/\D/g,"");
      return Store.colaboradores.find(c =>
        c.estabelecimento_id === estabId && c.ativo && String(c.cpf).replace(/\D/g,"") === limpo) || null;
    },
    listarAlertas(segmento){
      return Store.alertas.filter(a => a.segmento === segmento)
        .slice().sort((a,b) => b.publicado_em.localeCompare(a.publicado_em));
    },

  // Formata "2026-07-22T09:14:00Z" em "22/07/2026 · 09:14"
  function fmtDataHora(iso){
    const d = new Date(iso);
    const p = (n) => String(n).padStart(2,"0");
    return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} · ${p(d.getHours())}:${p(d.getMinutes())}`;
  }
  function fmtData(iso){
    const d = new Date(iso + (iso.length <= 10 ? "T00:00:00" : ""));
    const p = (n) => String(n).padStart(2,"0");
    return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()}`;
  }
  const escapeHtml = (s) => String(s).replace(/[&<>"']/g, m =>
    ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));

  // Valida CPF pelos dígitos verificadores (peso jurídico do registro).
  function cpfValido(cpf){
    const s = String(cpf).replace(/\D/g, "");
    if (s.length !== 11 || /^(\d)\1{10}$/.test(s)) return false;
    let soma = 0;
    for (let i = 0; i < 9; i++) soma += parseInt(s[i]) * (10 - i);
    let d1 = 11 - (soma % 11); if (d1 >= 10) d1 = 0;
    if (d1 !== parseInt(s[9])) return false;
    soma = 0;
    for (let i = 0; i < 10; i++) soma += parseInt(s[i]) * (11 - i);
    let d2 = 11 - (soma % 11); if (d2 >= 10) d2 = 0;
    return d2 === parseInt(s[10]);
  }
  // Formata "12345678901" → "123.456.789-01"
  function mascaraCpf(v){
    const s = String(v).replace(/\D/g, "").slice(0, 11);
    return s.replace(/(\d{3})(\d)/, "$1.$2").replace(/(\d{3})(\d)/, "$1.$2").replace(/(\d{3})(\d{1,2})$/, "$1-$2");
  }

  // Render simples do conteúdo: "## Título" vira seção, resto vira parágrafo.
  function renderConteudo(texto){
    const linhas = String(texto||"").split("\n");
    let html = "", buffer = [];
    const flush = () => { if (buffer.length){ html += `<p>${escapeHtml(buffer.join(" ")).trim()}</p>`; buffer=[]; } };
    linhas.forEach(ln => {
      const t = ln.trim();
      if (t.startsWith("## ")){ flush(); html += `<div class="doc-sec">${escapeHtml(t.slice(3))}</div>`; }
      else if (t === ""){ flush(); }
      else buffer.push(t);
    });
    flush();
    return html || '<p style="color:var(--ink-soft)">Documento em branco.</p>';
  }

  // Ícone por categoria de POP.
  function iconePop(categoria){
    const map = {
      "Dispensação": ic.pill, "Controlados": ic.pill,
      "Armazenamento": ic.thermo, "Logística": ic.box,
      "Limpeza": ic.spray, "Resíduos": ic.trash, "Atendimento": ic.chat,
    };
    return map[categoria] || ic.doc2;
  }

  // ---- Badge de status ----
  function badge(status){
    const map = {
      vigente:["b-vigente","vigente"], revisar:["b-revisar","revisar"],
      rascunho:["b-rascunho","rascunho"], aprovacao:["b-aprovacao","aprovação"],
    };
    const [cls,txt] = map[status] || map.rascunho;
    return `<span class="badge-pill ${cls}">${txt}</span>`;
  }

  // ---- Tela: POP (documento + leitura) ----
  function viewPop(){
    const e = Auth.estabelecimento || {};
    const p = DB.getPop(App.popId);
    if (!p) return `<button class="back-link" data-nav="biblioteca">← Biblioteca</button><p>POP não encontrado.</p>`;
    const leituras = DB.getLeituras(p.id, p.versao_atual);
    const equipe = totalEquipe(e.id);
    const totalLeram = leituras.length;

    // Resumo real de leitura da versão vigente (visível se o POP exige leitura).
    let faixa = "";
    if (p.status === "vigente"){
      const completo = totalLeram >= equipe && equipe > 0;
      faixa = completo
        ? `<div class="faixa ok">${ic.check}<span class="txt">Toda a equipe (${totalLeram}/${equipe}) confirmou a leitura da versão vigente.</span></div>`
        : `<div class="faixa pend">${ic.eye}<span class="txt">${totalLeram} de ${equipe} confirmaram a leitura da v${p.versao_atual}. Faltam ${equipe-totalLeram}.</span><button class="btn-amber" id="btn-faixa-distribuir">Distribuir</button></div>`;
    } else if (p.status === "rascunho" || p.status === "aprovacao"){
      faixa = `<div class="faixa pend">${ic.warn}<span class="txt">Este POP ainda não está vigente. Publique-o para exigir a leitura da equipe.</span></div>`;
    }

    let corpo;
    if (App.abaPop === "leitura"){
      corpo = viewLeitura(p, leituras, equipe, totalLeram);
    } else if (App.abaPop === "historico"){
      corpo = viewHistorico(p);
    } else if (App.editando){
      // EDITOR
      corpo = `
        <div class="editor-hint">${ic.edit} Use <strong>## Título</strong> para começar uma seção. Cada save gera uma nova versão.</div>
        <textarea id="pop-editor" class="pop-editor" spellcheck="true">${escapeHtml(App.rascunhoConteudo)}</textarea>
        <div class="fld" style="margin-top:12px"><label>Nota da alteração (opcional)</label>
          <input id="pop-nota" placeholder="Ex: revisão de redação da seção 2"></div>
        <div class="doc-actions">
          <button class="btn btn-primary" id="btn-salvar-versao">${ic.check} Salvar nova versão</button>
          <button class="btn" id="btn-cancelar-edicao">Cancelar</button>
        </div>`;
    } else {
      // VISUALIZAÇÃO
      const acoes = [];
      if (pode("editar")) acoes.push(`<button class="btn" id="btn-editar">${ic.edit} Editar</button>`);
      if (pode("aprovar") && (p.status==="aprovacao" || p.status==="rascunho"))
        acoes.push(`<button class="btn btn-primary" id="btn-aprovar">${ic.check} Aprovar e publicar</button>`);
      if (pode("editar") && p.status==="rascunho")
        acoes.push(`<button class="btn" id="btn-enviar-aprovacao">${ic.share} Enviar para aprovação</button>`);
      acoes.push(`<button class="btn" id="btn-distribuir">${ic.share} Distribuir</button>`);
      acoes.push(`<button class="btn" id="btn-pdf">${ic.download} PDF</button>`);
      corpo = `
        <div class="doc-card">${renderConteudo(p.conteudo)}</div>
        <div class="doc-actions">${acoes.join("")}</div>`;
    }

    return `
      <button class="back-link" data-nav="biblioteca">← Biblioteca</button>
      <div class="meta-top" style="margin-bottom:6px">
        <span class="pid">${p.id}</span>${badge(p.status)}
        <span class="pid">v${p.versao_atual}</span>
      </div>
      <h1 style="font-family:var(--display);font-size:22px;font-weight:700;margin-bottom:16px;letter-spacing:-.01em">${escapeHtml(p.nome)}</h1>
      ${App.editando ? "" : faixa}
      <div class="tabs">
        <button class="tab-btn ${App.abaPop==="documento"?"active":""}" data-aba="documento">${ic.file} Documento</button>
        <button class="tab-btn ${App.abaPop==="leitura"?"active":""}" data-aba="leitura">${ic.eye} Leitura (${totalLeram}/${equipe})</button>
        <button class="tab-btn ${App.abaPop==="historico"?"active":""}" data-aba="historico">${ic.history} Histórico</button>
      </div>
      ${corpo}`;
  }

  // ---- Aba: Histórico de versões ----
  function viewHistorico(p){
    const versoes = DB.getVersoes(p.id);
    if (!versoes.length) return '<p style="color:var(--ink-soft)">Sem histórico de versões.</p>';
    const itens = versoes.map(v => `
      <div class="ver-item">
        <div class="ver-dot ${v.vigente?"atual":""}"></div>
        <div class="ver-body">
          <div class="ver-head">
            <span class="ver-num">v${v.numero}</span>
            ${v.vigente?'<span class="badge-pill b-vigente">versão vigente</span>':""}
            <span class="ver-data">${fmtData(v.criado_em.slice(0,10))}</span>
          </div>
          <div class="ver-nota">${escapeHtml(v.nota)}</div>
          <div class="ver-autor">${ic.user2} ${escapeHtml(v.autor_nome)}</div>
        </div>
      </div>`).join("");
    return `<div class="ver-timeline">${itens}</div>`;
  }

  function viewLeitura(p, leituras, equipe, totalLeram){
    const e = Auth.estabelecimento || {};
    const registros = leituras.slice();
    const lista = registros.map(l => `
      <div class="read-item">
        <div class="av">${escapeHtml(iniciaisDe(l.leitor_nome))}</div>
        <div class="who"><div class="n">${escapeHtml(l.leitor_nome)}</div>
          <div class="c">${escapeHtml(l.leitor_cargo||"")}${l.leitor_cpf?" · CPF "+escapeHtml(l.leitor_cpf):""}</div></div>
        <div class="when"><div>${ic.clock} ${fmtDataHora(l.confirmado_em)}</div><div class="v">leu v${l.versao_numero}</div></div>
      </div>`).join("");

    const pendentes = DB.getPendentes(p.id, p.versao_atual, e.id)
      .map(c => `
        <div class="pend-chip">

    const base = (window.location && window.location.origin && window.location.origin !== "null")
      ? window.location.origin + window.location.pathname : "https://docflow.vercel.app";
    return `${base}#/ler/${e.id}/${pop.id}`;
  }
